<style>
  :root {
    --cream: #fff4e1; --ink: #3f3350; --ink-soft: rgba(63,51,80,.7); --butter: #ffe59a; --pink: #f7a8c4;
    --card: rgba(255,247,232,.95); --shadow: 0 18px 40px rgba(40,30,70,.35);
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2c2a4a; color: var(--ink);
    font-family: "Nunito", "Quicksand", "Varela Round", "Segoe UI Rounded", "Avenir Next Rounded", ui-rounded, "Hiragino Maru Gothic ProN", "Trebuchet MS", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }

  .pill.pop { transform: scale(1.1); }

  .icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center;
    background: rgba(44,36,70,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--cream);
    box-shadow: 0 4px 14px rgba(20,10,40,.25), inset 0 0 0 1px rgba(255,255,255,.14); }
  .icon-btn svg { width: 22px; height: 22px; display: block; }
  .icon-btn .off { display: none; } .icon-btn.muted .on { display: none; } .icon-btn.muted .off { display: block; }
  .icon-btn:focus-visible, button:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  .intro { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; width: min(92vw, 380px); text-align: center;
    color: var(--cream); opacity: 0; transition: opacity .4s; text-shadow: 0 2px 12px rgba(40,20,70,.8); }
  .intro.show { opacity: 1; }
  .intro .i-lv { font-size: 36px; font-weight: 900; line-height: 1.05; }

  .intro .i-tip:not(:empty) { display: inline-block; margin-top: 12px; padding: 9px 15px; border-radius: 16px; font-size: 15px; font-weight: 800;
    background: rgba(255,247,232,.94); color: var(--ink); text-shadow: none; box-shadow: 0 6px 18px rgba(40,30,70,.3); }
  .chain { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); z-index: 4; pointer-events: none; opacity: 0; text-align: center;

  .chain.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .chain .w { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 18px rgba(255,190,220,.95), 0 3px 0 rgba(150,70,120,.5); }

    opacity: 0; transition: opacity .3s, transform .3s cubic-bezier(.2,1.4,.4,1); max-width: min(86vw, 360px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .results { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: calc(66px + var(--sat)) 16px calc(16px + var(--sab)); opacity: 0; pointer-events: none; transition: opacity .35s, background .5s; }
  .results.show { opacity: 1; pointer-events: auto; background: rgba(30,22,52,.35); }
  .card { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 28px; padding: 20px 20px 16px; text-align: center;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.7); transform: translateY(24px) scale(.96); transition: transform .45s cubic-bezier(.2,1.4,.4,1); }
  .results.show .card { transform: none; }
  .card h2 { margin: 0; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); font-weight: 900; }
  .card .title { font-size: 28px; font-weight: 900; margin: 2px 0 4px; }
  .stars-row { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 66px; }
  .bigstar { font-size: 50px; line-height: 1; color: rgba(63,51,80,.13); }
  .bigstar.mid { font-size: 64px; }
  .bigstar.on { color: #ffc94d; text-shadow: 0 0 16px rgba(255,200,80,.85), 0 3px 0 #d9a23e; animation: starPop .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes starPop { from { transform: scale(.3) rotate(-30deg); } to { transform: none; } }
  .score { font-size: 48px; font-weight: 900; letter-spacing: -1px; line-height: 1.05; }
  .sub { font-size: 14px; font-weight: 800; color: var(--ink-soft); margin: 2px 0 10px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 8px 0 14px; }
  .fact { background: rgba(255,255,255,.6); border-radius: 16px; padding: 9px 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.85); }
  .fact .v { font-size: 21px; font-weight: 900; } .fact .k { font-size: 11px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); }
  .btn-primary { display: block; width: 100%; min-height: 58px; border: 0; border-radius: 20px; cursor: pointer; font-family: inherit;
    background: linear-gradient(180deg, #ffe59a, #f7c35c); color: #4c3310; font-size: 21px; font-weight: 900; box-shadow: 0 8px 0 #d9a23e, 0 14px 24px rgba(120,80,20,.25); }
  .btn-primary:active { transform: translateY(5px); box-shadow: 0 3px 0 #d9a23e; }
  .btn-more { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 18px; cursor: pointer; font-family: inherit; margin-bottom: 14px;
    background: linear-gradient(180deg, #ffb3cf, #f58fb4); color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 6px 0 #d46d95; }
  .btn-more[hidden] { display: none; }
  .btn-more small { display: block; font-size: 12px; opacity: .9; }
  .foot { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-top: 12px; }
  .foot a { color: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .pill, .chain, .toast, .card, .bigstar.on { transition: none !important; animation: none !important; } }

    </button>

<script>
'use strict';
/* =====================================================================
   MOSS & MOON — a tiny watercolor garden you wake with a tap.
   Sections: Core utils · Storage · Audio · Art (scenery) · Characters ·
             Game (seeds, chains, scoring) · UI · Boot
   ===================================================================== */

// ----------------------------------------------------------------- Core utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
};
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// Seedable RNG (mulberry32) so "Today's garden" is the same for everyone.
function makeRng(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => Math.floor(r.range(lo, hi + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  return r;
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ----------------------------------------------------------------- Storage (works without localStorage)
const Store = (() => {
  const KEY = 'mossmoon.bounce.v1';
  let mem = null;
  const defaults = () => ({ best: 0, bestChain: 0, drops: 0, rounds: 0, muted: false, unlocks: {}, daily: {}, seen: {}, stickers: {}, stickerNew: {}, level: 1, stars: {}, lvlBest: {}, lastPlayed: 0, pet: 'mochi', egg: null, dragon: { xp: 0, stage: 1 }, fails: {} });
  function load() {
    if (mem) return mem;
    mem = defaults();
    try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(mem, JSON.parse(raw)); } catch (e) { /* storage blocked: stay in memory */ }
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* ignore */ } }
  return { get: load, save };
})();

// ----------------------------------------------------------------- Melodies (original pentatonic tunes, one per garden)
// Notes are pentatonic degrees: 0 = C4, 5 = C5, 10 = C6. Every tune resolves on 5 (home).
const MELODIES = [
  { name: 'Moonlit Lullaby', notes: [5, 6, 7, 6, 5, 4, 5, 3, 4, 5, 6, 8, 7, 6, 4, 5] },
  { name: 'Firefly Waltz',   notes: [3, 5, 7, 6, 5, 4, 5, 7, 9, 8, 7, 6, 7, 5, 4, 5] },
  { name: 'Mossy Steps',     notes: [5, 5, 7, 6, 4, 4, 6, 5, 3, 4, 5, 7, 6, 4, 6, 5] },
  { name: 'Petal Rain',      notes: [9, 8, 7, 6, 7, 6, 5, 4, 5, 4, 3, 2, 3, 4, 6, 5] },
  { name: 'Sleepy Pond',     notes: [3, 4, 5, 3, 4, 5, 7, 5, 6, 7, 8, 6, 7, 6, 4, 5] },
  { name: 'Star Garden',     notes: [5, 7, 9, 10, 9, 7, 8, 6, 7, 5, 6, 4, 5, 3, 4, 5] },
];

// ----------------------------------------------------------------- Audio (procedural, Web Audio)
const Audio = (() => {
  let ctx = null, master = null, pad = null, started = false;
  let muted = !!Store.get().muted;
  // Pentatonic-ish scale (C major pentatonic + octaves) in Hz
  const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.7, 1318.5];
  const PENTA = [0, 2, 4, 7, 9];
  const deg = d => 261.63 * Math.pow(2, (Math.floor(d / 5) * 12 + PENTA[((d % 5) + 5) % 5]) / 12);
  let melody = MELODIES[0];
  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
      // very soft "night air" pad: two detuned triangle waves through a lowpass
      pad = ctx.createGain(); pad.gain.value = 0; pad.connect(master);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(pad);
      [130.81, 196.0, 261.63 * 1.003].forEach((f, i) => { const o = ctx.createOscillator(); o.type = i === 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = (i - 1) * 4; const g = ctx.createGain(); g.gain.value = i === 2 ? .35 : .22; o.connect(g); g.connect(lp); o.start(); });
      return true;
    } catch (e) { ctx = null; return false; }
  }
  function unlock() { // must be called from a user gesture
    if (!ensure()) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (!started) { started = true; pad.gain.setTargetAtTime(0.045, ctx.currentTime, 2.5); }
  }
  function now() { return ctx ? ctx.currentTime : 0; }
  function tone(freq, { type = 'sine', dur = .6, vol = .3, attack = .005, delay = 0, detune = 0, bend = 0 } = {}) {
    if (!ctx || muted) return;
    const t0 = now() + delay;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0); o.detune.value = detune;
    if (bend) o.frequency.exponentialRampToValueAtTime(freq * bend, t0 + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
  }
  function chime(freq, delay = 0, vol = .22, dur = .9) { // bell-like: fundamental + soft partials
    tone(freq, { type: 'sine', dur, vol, delay });
    tone(freq * 2, { type: 'sine', dur: dur * .55, vol: vol * .28, delay });
    tone(freq * 3.01, { type: 'sine', dur: dur * .3, vol: vol * .09, delay });
  }
  function noise(dur = .25, vol = .08, delay = 0, hp = 1800) {
    if (!ctx || muted) return;
    const n = Math.floor(ctx.sampleRate * dur); const buf = ctx.createBuffer(1, n, ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(); s.buffer = buf; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); const t0 = now() + delay; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0008, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  }
  const api = {
    unlock,
    get muted() { return muted; },
    setMuted(m) { muted = m; Store.get().muted = m; Store.save(); if (master) master.gain.setTargetAtTime(m ? 0 : .8, now(), .05); },
    tap() { tone(220, { type: 'triangle', dur: .12, vol: .12, bend: 1.6 }); noise(.08, .05, 0, 3000); },      // seed squish
    setMelody(m) { melody = m; },
    // The n-th bloom of a chain plays the n-th note of this garden's tune. Long chains loop it with more layers.
    bloom(i) {
      const notes = melody.notes, k = i % notes.length, loop = Math.floor(i / notes.length);
      chime(deg(notes[k]), 0, .2); noise(.18, .035, 0, 2500);
      if (loop >= 1) chime(deg(notes[k] - 2), .015, .07, .7);
      if (loop >= 2 && k % 4 === 0) tone(deg(0) / 2, { type: 'sine', dur: 1.2, vol: .14, attack: .05 });
    },
    echo(i) { const notes = melody.notes; chime(deg(notes[i % notes.length] + 2), 0, .08, .6); },
    catch(perfect) {
      chime(deg(10), 0, .1, .45); tone(2637, { dur: .12, vol: .035 });
      if (perfect) { chime(deg(12), .05, .14, .8); chime(deg(14), .1, .1, .9); noise(.3, .03, .05, 5000); }
    },
    star(i) { chime(deg(8 + i * 2), 0, .16, 1.1); chime(deg(10 + i * 2), .08, .12, 1.3); },
    nope() { tone(330, { type: 'triangle', dur: .1, vol: .05 }); tone(311, { type: 'triangle', dur: .12, vol: .05, delay: .07 }); },
    praise(level) { const run = [0, 1, 2, 3, 5].slice(0, 3 + Math.min(level, 2)); run.forEach((d, j) => chime(deg(7 + d + Math.min(level, 3)), j * .055, .1, .9)); },
    drop(i) { tone(1760 + (i % 3) * 220, { dur: .18, vol: .05, delay: i * .02 }); },
    miss() { tone(160, { type: 'triangle', dur: .18, vol: .07, bend: .8 }); },
    moon() { // rich flourish: arpeggio + shimmer
      [0, 2, 4, 6, 8, 10, 12].forEach((k, i) => chime(SCALE[k] * .5, i * .09, .22, 1.8));
      [12, 10, 12, 11, 12].forEach((k, i) => chime(SCALE[k], .7 + i * .11, .1, 1.2));
      tone(65.4, { type: 'sine', dur: 2.6, vol: .25, attack: .3 });
    },

// ----------------------------------------------------------------- Haptics (Android vibration; silent when sound is muted)
const Haptics = {
  last: 0,
  buzz(pattern, minGap) {
    if (Audio.muted || !navigator.vibrate) return;
    const now = performance.now(); if (minGap && now - this.last < minGap) return; this.last = now;
    try { navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  },
};

// ----------------------------------------------------------------- Canvas + scenery
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
const Scene = { bg: null, grain: null, hills: [], grass: [], pollen: [], fireflies: [], stars: [], horizon: 0, pond: null, cottage: null, ripples: [] };

function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d');
  const img = g.createImageData(160, 160); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = 200 + Math.random() * 55; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
}

// Organic, slightly wobbly closed/open path through points
function wobbly(g, pts, jitter, closed, seed) {
  const r = makeRng(seed || 7);
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], jx = (r() - .5) * jitter, jy = (r() - .5) * jitter;
    if (i === 0) g.moveTo(p[0] + jx, p[1] + jy);
    else { const q = pts[i - 1]; const mx = (q[0] + p[0]) / 2 + (r() - .5) * jitter, my = (q[1] + p[1]) / 2 + (r() - .5) * jitter; g.quadraticCurveTo(mx, my, p[0] + jx, p[1] + jy); }
  }
  if (closed) g.closePath();
}
// Watercolor wash: several offset translucent layers + a darker bleed edge
function wash(g, pathFn, color, edge, layers = 3, spread = 3) {
  for (let i = 0; i < layers; i++) {
    g.save(); g.translate((i % 2 ? 1 : -1) * spread * (i * .5 + .5), (i < 2 ? 1 : -1) * spread * .6 * i);
    g.globalAlpha = 0.45 / layers + .28; g.fillStyle = color; pathFn(g, i); g.fill(); g.restore();
  }
  if (edge) { g.save(); g.globalAlpha = .35; g.lineWidth = 1.6; g.strokeStyle = edge; pathFn(g, 0); g.stroke(); g.restore(); }
}

function hillPoints(y0, amp, freq, phase, n = 14) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const x = (i / n) * W; pts.push([x, y0 + Math.sin(i * freq + phase) * amp + Math.cos(i * freq * 2.3 + phase) * amp * .35]); }
  pts.push([W + 20, H + 20], [-20, H + 20]);
  return pts;
}

function resize() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  W = vw; H = vh;
  const area = vw * vh;
  DPR = Math.min(window.devicePixelRatio || 1, area > 900000 ? 1.5 : 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScene();
  if (typeof Game !== 'undefined' && Game.seeds) Game.relayout();
}

function buildScene() {
  if (!Scene.grain) Scene.grain = makeGrain();
  const landscape = W > H * 1.1;
  Scene.horizon = H * (landscape ? 0.24 : 0.30);
  const bg = document.createElement('canvas'); bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
  const g = bg.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = makeRng(1234);

  // Sky: dusk wash — lavender → pink → butter at the horizon
  const sky = g.createLinearGradient(0, 0, 0, Scene.horizon * 1.25);
  sky.addColorStop(0, '#5d5a9c'); sky.addColorStop(.35, '#9a86c9'); sky.addColorStop(.68, '#e6a9c3'); sky.addColorStop(.92, '#ffd9a6'); sky.addColorStop(1, '#fff0c4');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // soft clouds
  for (let i = 0; i < 4; i++) {
    const cx = r() * W, cy = Scene.horizon * (0.3 + r() * .55), cw = W * (0.22 + r() * .25), ch = cw * .16;
    g.save(); g.globalAlpha = .16 + r() * .1; g.fillStyle = '#fff5ea'; g.filter = 'blur(6px)';
    g.beginPath(); g.ellipse(cx, cy, cw * .5, ch * .5, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(cx - cw * .2, cy - ch * .25, cw * .28, ch * .5, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(cx + cw * .18, cy - ch * .15, cw * .22, ch * .45, 0, 0, TAU); g.fill();
    g.restore();
  }
  // Stars (static positions; twinkle drawn live)
  Scene.stars = [];
  for (let i = 0; i < 70; i++) Scene.stars.push({ x: r() * W, y: r() * Scene.horizon * .75, s: .6 + r() * 1.4, p: r() * TAU });
  // Moon
  const mx = W * 0.22, my = Scene.horizon * 0.46, mr = Math.min(W, H) * 0.075;
  Scene.moon = { x: mx, y: my, r: mr };
  const halo = g.createRadialGradient(mx, my, mr * .6, mx, my, mr * 4); halo.addColorStop(0, 'rgba(255,240,200,.55)'); halo.addColorStop(.4, 'rgba(255,230,190,.18)'); halo.addColorStop(1, 'rgba(255,230,190,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.save(); g.fillStyle = '#fff6d6'; g.shadowColor = 'rgba(255,240,200,.9)'; g.shadowBlur = 24; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill(); g.restore();
  g.save(); g.globalAlpha = .22; g.fillStyle = '#e8d3a8'; [[-.3, -.2, .22], [.25, .1, .16], [-.05, .4, .12], [.4, -.4, .1]].forEach(([a, b, c]) => { g.beginPath(); g.arc(mx + a * mr, my + b * mr, c * mr, 0, TAU); g.fill(); }); g.restore();

  // Far hills (lavender-blue, misty)
  const farY = Scene.horizon;
  wash(g, (c, i) => wobbly(c, hillPoints(farY + 4, H * .035, 1.9, 1.2, 10), 2, true, 11 + i), '#b7a8dc', null, 3, 2);
  g.save(); const mist = g.createLinearGradient(0, farY - 10, 0, farY + H * .08); mist.addColorStop(0, 'rgba(255,225,215,.0)'); mist.addColorStop(1, 'rgba(255,225,215,.55)'); g.fillStyle = mist; g.fillRect(0, farY - 10, W, H * .09); g.restore();
  wash(g, (c, i) => wobbly(c, hillPoints(farY + H * .05, H * .03, 2.6, 4.1, 10), 2, true, 21 + i), '#9fa0cf', null, 3, 2);
  // tiny far trees
  g.save(); g.fillStyle = 'rgba(110,105,170,.55)';
  for (let i = 0; i < 26; i++) { const x = r() * W, y = farY + H * .05 + Math.sin(x / W * 2.6 * 10 / W * W + 4.1) * 0; const h = 6 + r() * 10; g.beginPath(); g.moveTo(x - h * .35, y + 6); g.lineTo(x, y - h); g.lineTo(x + h * .35, y + 6); g.closePath(); g.fill(); }
  g.restore();

  // Mid hill (sage) with cottage
  const midY = farY + H * (landscape ? .05 : .06);
  wash(g, (c, i) => wobbly(c, hillPoints(midY, H * .028, 1.4, 2.2, 12), 3, true, 31 + i), '#8db98f', '#5f8a63', 3, 3);
  drawCottage(g, W * 0.80, midY + H * .012, Math.min(W, H) * 0.11);
  drawTree(g, W * 0.13, midY - H * .005, Math.min(W, H) * .11, r);
  drawTree(g, W * 0.93, midY + H * .02, Math.min(W, H) * .07, r);

  // Main meadow (the play field): warm mossy green with a lighter path of light under the moon
  const meadowY = midY + H * (landscape ? .04 : .045);
  wash(g, (c, i) => wobbly(c, hillPoints(meadowY, H * .02, 1.1, .6, 12), 4, true, 41 + i), '#a9cc93', '#6f9a66', 4, 3);
  const glow = g.createRadialGradient(W * .5, H * .66, 10, W * .5, H * .66, W * .75); glow.addColorStop(0, 'rgba(255,245,200,.22)'); glow.addColorStop(1, 'rgba(255,245,200,0)');
  g.fillStyle = glow; g.fillRect(0, meadowY - 20, W, H);
  // mossy texture: dapples
  g.save();
  for (let i = 0; i < 160; i++) { const x = r() * W, y = meadowY + r() * (H - meadowY); const rr = 4 + r() * 14; g.globalAlpha = .07 + r() * .09; g.fillStyle = r() < .5 ? '#7fae73' : '#d6e6a8'; g.beginPath(); g.ellipse(x, y, rr * 1.4, rr * .6, r() * 3, 0, TAU); g.fill(); }
  g.restore();
  // Pond (bottom-left)
  Scene.pond = { x: landscape ? W * .12 : W * 0.2, y: H * 0.905, rx: Math.min(W, H * .6) * 0.17, ry: H * 0.035 };
  const p = Scene.pond;
  wash(g, (c) => { c.beginPath(); c.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, TAU); }, '#8fc5e8', '#6aa4cc', 3, 2);
  g.save(); g.globalAlpha = .5; const pg = g.createLinearGradient(0, p.y - p.ry, 0, p.y + p.ry); pg.addColorStop(0, '#c7e6f7'); pg.addColorStop(1, '#7fb6dc'); g.fillStyle = pg; g.beginPath(); g.ellipse(p.x, p.y, p.rx * .92, p.ry * .85, 0, 0, TAU); g.fill(); g.restore();
  // stones + mushrooms + flowers scattered (decor)
  for (let i = 0; i < 9; i++) { const x = r() * W, y = meadowY + H * .02 + r() * (H - meadowY - H * .1); if (dist(x, y, p.x, p.y) < p.rx * 1.3) continue; drawStone(g, x, y, 5 + r() * 9, r); }
  for (let i = 0; i < 7; i++) { const x = r() * W, y = meadowY + H * .03 + r() * (H - meadowY - H * .12); if (dist(x, y, p.x, p.y) < p.rx * 1.3) continue; drawMushroom(g, x, y, 6 + r() * 7, r); }
  // foreground grass tufts (static layer), plus a living set for sway
  Scene.grass = [];
  for (let i = 0; i < 230; i++) { const x = r() * W, y = meadowY + r() * (H - meadowY); if (dist(x, y, p.x, p.y) < p.rx * 1.05) continue; Scene.grass.push({ x, y, h: 6 + r() * 9 + (y / H) * 10, w: 1.2 + r() * 1.4, ph: r() * TAU, lean: (r() - .5) * 8, c: r() < .4 ? 'rgba(104,152,92,.75)' : r() < .7 ? 'rgba(143,185,122,.8)' : 'rgba(186,214,140,.75)' }); }
  // Paper grain overlay
  g.save(); g.globalAlpha = .13; g.globalCompositeOperation = 'multiply'; const pat = g.createPattern(Scene.grain, 'repeat'); g.fillStyle = pat; g.fillRect(0, 0, W, H); g.restore();

  Scene.bg = bg; Scene.meadowY = meadowY; Scene.midY = midY;
  Scene.pollen = []; for (let i = 0; i < (REDUCED ? 14 : 36); i++) Scene.pollen.push({ x: Math.random() * W, y: Math.random() * H, s: .8 + Math.random() * 1.8, ph: Math.random() * TAU, v: 6 + Math.random() * 10 });
  Scene.fireflies = []; for (let i = 0; i < (REDUCED ? 6 : 14); i++) Scene.fireflies.push({ x: Math.random() * W, y: meadowY - 40 + Math.random() * (H - meadowY), ph: Math.random() * TAU, a: Math.random() * TAU, sp: 8 + Math.random() * 14 });
}

function drawCottage(g, x, y, s) {
  const r = makeRng(99);
  // walls
  wash(g, (c) => wobbly(c, [[x - s * .5, y], [x - s * .5, y - s * .55], [x + s * .5, y - s * .55], [x + s * .5, y]], 2, true, 5), '#f4e3c9', '#b99b7a', 3, 1.5);
  // roof (soft mossy pink)
  wash(g, (c) => wobbly(c, [[x - s * .62, y - s * .52], [x, y - s * 1.0], [x + s * .62, y - s * .52]], 2, true, 6), '#d79aa4', '#9e5f6e', 3, 1.5);
  g.save(); g.fillStyle = 'rgba(140,180,120,.55)'; g.beginPath(); g.ellipse(x - s * .2, y - s * .75, s * .18, s * .07, -.5, 0, TAU); g.fill(); g.restore();
  // chimney
  g.fillStyle = '#c9a98f'; g.fillRect(x + s * .25, y - s * .95, s * .12, s * .28);
  // door + windows (window glow drawn live when unlocked)
  g.fillStyle = '#8b6a4f'; g.beginPath(); g.roundRect ? g.roundRect(x - s * .1, y - s * .3, s * .2, s * .3, s * .08) : g.rect(x - s * .1, y - s * .3, s * .2, s * .3); g.fill();
  Scene.cottage = { x, y, s, windows: [[x - s * .33, y - s * .38], [x + s * .33, y - s * .38]] };
  g.fillStyle = '#6f5d8f'; Scene.cottage.windows.forEach(([wx, wy]) => { g.fillRect(wx - s * .07, wy - s * .07, s * .14, s * .14); });
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; Scene.cottage.windows.forEach(([wx, wy]) => { g.beginPath(); g.moveTo(wx, wy - s * .07); g.lineTo(wx, wy + s * .07); g.moveTo(wx - s * .07, wy); g.lineTo(wx + s * .07, wy); g.stroke(); });
  // bush beside
  wash(g, (c) => { c.beginPath(); c.ellipse(x + s * .62, y - s * .06, s * .24, s * .16, 0, 0, TAU); }, '#7fae73', '#5a8a55', 2, 1.5);
}
function drawTree(g, x, y, s, r) {
  g.fillStyle = '#8a6a55'; g.beginPath(); g.moveTo(x - s * .07, y); g.lineTo(x - s * .04, y - s * .45); g.lineTo(x + s * .04, y - s * .45); g.lineTo(x + s * .07, y); g.closePath(); g.fill();
  const cols = ['#f4b6c7', '#f7c6d2', '#e9a2b8'];
  for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, rr = s * (.28 + r() * .14); const cx = x + Math.cos(a) * s * .22, cy = y - s * .6 + Math.sin(a) * s * .17; wash(g, (c) => { c.beginPath(); c.ellipse(cx, cy, rr, rr * .8, 0, 0, TAU); }, r.pick(cols), null, 2, 1.5); }
  wash(g, (c) => { c.beginPath(); c.ellipse(x, y - s * .62, s * .3, s * .24, 0, 0, TAU); }, '#fbd0dc', '#c98aa1', 2, 1);
}
function drawStone(g, x, y, s, r) { wash(g, (c) => { c.beginPath(); c.ellipse(x, y, s, s * .62, (r() - .5) * .6, 0, 0, TAU); }, '#b9b4c6', '#8b84a0', 2, 1); g.save(); g.globalAlpha = .4; g.fillStyle = '#9ec98c'; g.beginPath(); g.ellipse(x - s * .3, y - s * .3, s * .45, s * .22, 0, 0, TAU); g.fill(); g.restore(); }
function drawMushroom(g, x, y, s, r) {
  g.fillStyle = '#f7ecd8'; g.beginPath(); g.roundRect ? g.roundRect(x - s * .22, y - s * .5, s * .44, s * .55, s * .15) : g.rect(x - s * .22, y - s * .5, s * .44, s * .55); g.fill();
  wash(g, (c) => { c.beginPath(); c.ellipse(x, y - s * .5, s * .62, s * .38, 0, Math.PI, TAU); c.closePath(); }, r() < .5 ? '#f08a8a' : '#f2b16b', '#b85a5a', 2, 1);
  g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + (r() - .5) * s * .8, y - s * .6 - r() * s * .18, s * .07 + r() * s * .05, 0, TAU); g.fill(); }
}

// ---- live scenery layers (called every frame) ----
function drawSkyLife(t) {
  ctx.save();
  for (const s of Scene.stars) { const a = .35 + .65 * (0.5 + 0.5 * Math.sin(t * 1.6 + s.p)); ctx.globalAlpha = a * .9; ctx.fillStyle = '#fff8e6'; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, TAU); ctx.fill(); }
  ctx.restore();
  // cottage windows glow when unlocked; chimney smoke always
  const c = Scene.cottage;
  if (c) {
    if (Store.get().unlocks.cottage) { ctx.save(); const pulse = .75 + .25 * Math.sin(t * 2.2); ctx.fillStyle = `rgba(255,214,120,${0.85 * pulse})`; ctx.shadowColor = 'rgba(255,200,100,.9)'; ctx.shadowBlur = 14; c.windows.forEach(([wx, wy]) => ctx.fillRect(wx - c.s * .07, wy - c.s * .07, c.s * .14, c.s * .14)); ctx.restore(); }
    if (!REDUCED) { ctx.save(); ctx.fillStyle = 'rgba(255,250,240,.35)'; for (let i = 0; i < 4; i++) { const k = (t * .35 + i * .25) % 1; ctx.globalAlpha = (1 - k) * .4; ctx.beginPath(); ctx.arc(c.x + c.s * .31 + Math.sin(k * 6 + i) * c.s * .06, c.y - c.s * .98 - k * c.s * .5, c.s * (.04 + k * .09), 0, TAU); ctx.fill(); } ctx.restore(); }
  }
}
function drawWater(t) {
  const p = Scene.pond; if (!p) return;
  ctx.save(); ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx * .92, p.ry * .85, 0, 0, TAU); ctx.clip();
  // moon reflection + moving highlights
  ctx.globalAlpha = .35; ctx.fillStyle = '#fff4d0'; ctx.beginPath(); ctx.ellipse(p.x + p.rx * .25, p.y - p.ry * .1 + Math.sin(t * 1.3) * 1.5, p.rx * .14, p.ry * .3, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) { const k = ((t * .25 + i * .25) % 1); ctx.globalAlpha = (1 - k) * .5; ctx.beginPath(); ctx.ellipse(p.x - p.rx * .2 + i * p.rx * .15, p.y + p.ry * .1, p.rx * (.15 + k * .6), p.ry * (.12 + k * .55), 0, 0, TAU); ctx.stroke(); }
  for (const rp of Scene.ripples) { const k = rp.t; ctx.globalAlpha = (1 - k) * .7; ctx.beginPath(); ctx.ellipse(rp.x, rp.y, 4 + k * p.rx * .8, 2 + k * p.ry * .8, 0, 0, TAU); ctx.stroke(); }
  ctx.restore();
}
function drawGrass(t, pulses) {
  const windBase = REDUCED ? 0 : Math.sin(t * .9) * .5 + Math.sin(t * 2.3) * .25;
  ctx.save(); ctx.lineCap = 'round';
  for (const b of Scene.grass) {
    let sway = windBase * 2.2 + (REDUCED ? 0 : Math.sin(t * 1.7 + b.ph) * 1.6);
    // bloom pulses push grass outward
    for (const p of pulses) { const d = dist(b.x, b.y, p.x, p.y); const edge = p.r - d; if (edge > -40 && edge < 30) sway += ((b.x - p.x) / (d + 1)) * 9 * (1 - p.t); }
    ctx.strokeStyle = b.c; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(b.x + b.lean * .3 + sway * .4, b.y - b.h * .6, b.x + b.lean + sway, b.y - b.h); ctx.stroke();
  }
  ctx.restore();
}
function drawAir(t, dt) {
  ctx.save();
  for (const p of Scene.pollen) {
    p.x += (Math.sin(t * .7 + p.ph) * 8 + 4) * dt; p.y -= p.v * dt * .35; p.y += Math.sin(t * 1.1 + p.ph) * 4 * dt;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } if (p.x > W + 10) p.x = -10;
    ctx.globalAlpha = .25 + .35 * (0.5 + 0.5 * Math.sin(t * 2 + p.ph)); ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
  }
  for (const f of Scene.fireflies) {
    f.a += (Math.sin(t * .8 + f.ph) * .9) * dt; f.x += Math.cos(f.a) * f.sp * dt; f.y += Math.sin(f.a) * f.sp * .5 * dt;
    if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10; if (f.y < Scene.meadowY - 60) f.y = Scene.meadowY - 60; if (f.y > H) f.y = Scene.meadowY;
    const a = Math.max(0, Math.sin(t * 2.4 + f.ph * 3)); if (a < .05) continue;
    ctx.globalAlpha = a * .9; ctx.fillStyle = '#eaffb0'; ctx.shadowColor = '#d6ff7a'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }

Game.startFinale = function () {

// ---------------------------------------------------------------- drawing

function drawBall(g, b, t) {

function drawAim(g, t, angle, alpha) {

function render(t) {

// ---------------------------------------------------------------- UI

const $ = id => document.getElementById(id);
const UI = {
  toastT: 0, praiseT: 0,

    const r = Game.run;
    $('introLv').textContent = 'Level ' + Game.level + (levelRecipe(Game.level).breather ? ' · Breather' : '');
    $('introGoal').innerHTML = `Bloom all <b>${r.total} pink buds</b> · ${DROPS} drops`;
    $('introTip').textContent = TIPS[Game.level] || (Game.sessionPlayed ? '' : 'Drag to aim · let go to drop ✨');

    canvas.focus({ preventScroll: true });
  },
  hideIntro() { $('intro').classList.remove('show'); },
  score(reset) {
    $('score').textContent = Game.run.score.toLocaleString();
    $('scoreSr').textContent = `${Game.run.score} points, ${Game.run.left} buds left`;
    if (!reset) { const p = $('scorePill'); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop'); }
  },
  buds() {

    const el = $('mult'); el.textContent = '×' + m; el.classList.toggle('on', m > 1 && r.left > 0);
    const p = $('budsPill'); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
  },
  drops() {},
  praise(word, n, big) {
    $('chainW').textContent = word; $('chainN').textContent = big ? '' : n + ' flowers in one drop';
    const c = $('chain'); c.classList.remove('show'); void c.offsetWidth; c.classList.add('show'); UI.praiseT = big ? 2.2 : 1.3;
    if (!big) { Audio.praise(Math.min(3, Math.floor(n / 10))); Haptics.buzz([20, 40, 20]); const m = Game.mochi; m.mood = 'happy'; m.happyT = 1.2; m.hopV = -220; }
  },
  chainHide() { $('chain').classList.remove('show'); },
  toast(msg, dur = 2) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); UI.toastT = dur; },
  tick(dt) {
    if (UI.toastT > 0) { UI.toastT -= dt; if (UI.toastT <= 0) $('toast').classList.remove('show'); }
    if (UI.praiseT > 0) { UI.praiseT -= dt; if (UI.praiseT <= 0) UI.chainHide(); }
  },
  setMuted(m) { Audio.setMuted(m); const b = $('muteBtn'); b.classList.toggle('muted', m); b.setAttribute('aria-pressed', String(m)); b.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound'); },
  results(cleared) {
    const st = Store.get(), r = Game.run, L = Game.level;
    const spare = cleared ? (r.dropsAtClear || 0) : 0;
    const stars = !cleared ? 0 : spare >= 4 ? 3 : spare >= 2 ? 2 : 1;
    st.rounds = (st.rounds || 0) + 1; st.lastPlayed = Date.now();
    st.bstars = st.bstars || {}; st.bbest = st.bbest || {};
    const prevBest = st.bbest[L] || 0; st.bbest[L] = Math.max(prevBest, r.score);

// ---------------------------------------------------------------- input: drag to aim, let go to drop
function aimAt(x, y) {
  const dx = x - Lay.launchX, dy = Math.max(y - Lay.launchY, 6);
  Game.aim = clamp(Math.atan2(dy, dx), rad(8), rad(172));
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); canvas.focus({ preventScroll: true }); Audio.unlock();
  if (Game.state !== 'aim') return;
  Game.aiming = true; Game.demo = false; Game.idleT = 0; UI.hideIntro(); aimAt(e.clientX, e.clientY);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}, { passive: false });
canvas.addEventListener('pointermove', e => {
  if (Game.aiming) aimAt(e.clientX, e.clientY);
  else if (e.pointerType === 'mouse' && Game.state === 'aim') { Game.mouseAim = true; Game.demo = false; aimAt(e.clientX, e.clientY); }
});
canvas.addEventListener('pointerup', e => {
  if (!Game.aiming) return; Game.aiming = false;
  if (e.clientY < Lay.launchY - 10) { UI.toast('Aim below the moon to drop', 1.2); return; }   // drag back up to cancel
  aimAt(e.clientX, e.clientY); Game.fire();
});
canvas.addEventListener('pointercancel', () => { Game.aiming = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
['touchstart', 'touchmove', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => { if (e.target === canvas) e.preventDefault(); }, { passive: false }));
canvas.addEventListener('keydown', e => {
  if (Game.state !== 'aim') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); Game.kbAim = true; Game.demo = false; Game.aim = clamp(Game.aim + rad(2), rad(8), rad(172)); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); Game.kbAim = true; Game.demo = false; Game.aim = clamp(Game.aim - rad(2), rad(8), rad(172)); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Audio.unlock(); Game.fire(); }
  else if (e.key.toLowerCase() === 'm') UI.setMuted(!Audio.muted);
});
$('muteBtn').addEventListener('click', () => { Audio.unlock(); UI.setMuted(!Audio.muted); });
$('nextBtn').addEventListener('click', () => { Audio.unlock(); Game.startLevel(Game.cleared ? Game.level + 1 : Game.level); });
$('moreBtn').addEventListener('click', () => { Audio.unlock(); Game.oneMore(); });

// ---------------------------------------------------------------- loop & boot
let lastT = 0, running = false, rafId = 0, gameT = 0;
function frame(ts) {
  rafId = requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  const dt = Math.min((ts - lastT) / 1000, .05); lastT = ts; gameT += dt;
  Game.update(dt, gameT); UI.tick(dt); render(gameT);
}
function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
window.addEventListener('pagehide', stop); window.addEventListener('pageshow', start);
UI.setMuted(!!Store.get().muted);
Game.sessionPlayed = false;
resize();
Game.startLevel(Store.get().blevel || 1);
start();
window.MossBounce = { Game, Lay, Store, simLevel, newRun, levelRecipe, buildLevelPegs, stepRun, Audio, chooseAngle };
</script>
</body>
</html>
