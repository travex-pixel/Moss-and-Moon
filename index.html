<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#2c2a4a">
<meta name="description" content="Moss & Moon — tap a glowing seed and wake a tiny watercolor garden with a chain of blooms.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Moss & Moon">
<meta property="og:title" content="Moss & Moon — wake the garden">
<meta property="og:description" content="Tap one glowing seed and watch a tiny watercolor garden bloom in a chain. A one-minute game with very small, very round creatures.">
<meta property="og:url" content="https://travex-pixel.github.io/Moss-and-Moon/">
<meta property="og:image" content="https://travex-pixel.github.io/Moss-and-Moon/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A sleepy watercolor garden under a big moon, with a chain of pastel flowers blooming and a tiny moss creature watching.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Moss & Moon — wake the garden">
<meta name="twitter:description" content="Tap one glowing seed and watch a tiny watercolor garden bloom in a chain.">
<meta name="twitter:image" content="https://travex-pixel.github.io/Moss-and-Moon/og.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Moss & Moon</title>
<style>
  :root {
    --cream: #fff4e1;
    --ink: #3f3350;
    --ink-soft: rgba(63,51,80,.7);
    --sage: #9fc39b;
    --pink: #f6b8c6;
    --butter: #ffe59a;
    --lavender: #c9b8ef;
    --sky: #a9d4f0;
    --moon: #fff2c4;
    --card: rgba(255,247,232,.94);
    --shadow: 0 18px 40px rgba(40,30,70,.35);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #2c2a4a;
    font-family: "Nunito", "Quicksand", "Varela Round", "Segoe UI Rounded", "Avenir Next Rounded", ui-rounded, "Hiragino Maru Gothic ProN", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; outline: none; }
  #stage:focus-visible { box-shadow: inset 0 0 0 3px rgba(255,240,190,.6); }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(10px + var(--sat)) calc(12px + var(--sar)) 0 calc(12px + var(--sal));
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 12;
  }
  .hud > * { pointer-events: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 44px; padding: 8px 14px 8px 11px;
    border-radius: 999px;
    background: rgba(44,36,70,.42);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--cream); font-weight: 800; font-size: 18px; letter-spacing: .2px;
    box-shadow: 0 4px 14px rgba(20,10,40,.25), inset 0 0 0 1px rgba(255,255,255,.14);
    transition: transform .18s cubic-bezier(.2,1.4,.4,1);
  }
  .pill.pop { transform: scale(1.12); }
  .pill .drop { width: 18px; height: 22px; display: block; }
  .pill .label { font-size: 12px; font-weight: 700; opacity: .8; margin-left: 2px; }
  .hud-right { display: flex; gap: 8px; }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    background: rgba(44,36,70,.42);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(20,10,40,.25), inset 0 0 0 1px rgba(255,255,255,.14);
    color: var(--cream); display: grid; place-items: center;
    transition: transform .15s cubic-bezier(.2,1.4,.4,1), background .2s;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  .icon-btn svg { width: 22px; height: 22px; display: block; }
  .icon-btn .off { display: none; }
  .icon-btn.muted .on { display: none; }
  .icon-btn.muted .off { display: block; }

  /* sparks (taps left) */
  .sparks {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + var(--sab));
    display: flex; gap: 10px; align-items: center; z-index: 5;
    pointer-events: none;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(44,36,70,.32);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    opacity: 0; transition: opacity .4s;
  }
  .sparks.show { opacity: 1; }
  .sparks .lbl { color: var(--cream); font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; opacity: .85; margin-right: 2px; }
  .spark {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff9dc, #ffd36a 55%, #f39b5a);
    box-shadow: 0 0 10px 2px rgba(255,220,120,.7);
    transition: transform .35s cubic-bezier(.2,1.4,.4,1), opacity .35s, filter .35s;
  }
  .spark.used { transform: scale(.55); opacity: .28; filter: grayscale(.6); box-shadow: none; }

  /* chain banner */
  .chain {
    position: fixed; left: 50%; top: 24%;
    transform: translate(-50%, -50%) scale(.6);
    z-index: 4; pointer-events: none; opacity: 0;
    text-align: center;
    transition: transform .22s cubic-bezier(.2,1.6,.4,1), opacity .2s;
    text-shadow: 0 2px 0 rgba(90,40,90,.25), 0 6px 22px rgba(70,30,90,.35);
  }
  .chain.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .chain .n { font-size: 54px; font-weight: 900; color: var(--moon); line-height: 1; letter-spacing: -1px; }
  .chain .t { font-size: 15px; font-weight: 800; color: var(--cream); letter-spacing: 2px; text-transform: uppercase; opacity: .9; }
  .chain.big .n { color: #ffd6e8; }
  .chain.huge .n { color: #ffe59a; font-size: 64px; }
  .chain .w {
    margin-top: 6px; font-size: 30px; font-weight: 900; letter-spacing: .5px; color: #fff;
    opacity: 0; transform: scale(.4) rotate(-8deg); transition: transform .35s cubic-bezier(.2,1.8,.4,1), opacity .2s;
    text-shadow: 0 0 18px rgba(255,190,220,.9), 0 3px 0 rgba(150,70,120,.45);
  }
  .chain .w.show { opacity: 1; transform: scale(1) rotate(-3deg); }

  /* invitation */
  .invite {
    position: fixed; left: 50%; top: calc(16% + var(--sat));
    transform: translateX(-50%); z-index: 4; pointer-events: none;
    text-align: center; color: var(--cream);
    opacity: 0; transition: opacity .6s;
    text-shadow: 0 2px 10px rgba(50,30,80,.5);
  }
  .invite.show { opacity: 1; }
  .invite h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: .5px; line-height: 1.05; }
  .invite h1 span { color: var(--butter); }
  .invite p { margin: 8px 0 0; font-size: 17px; font-weight: 700; opacity: .92; white-space: nowrap; }
  .invite p.hint { font-size: 14px; opacity: .8; margin-top: 4px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; top: calc(32% + var(--sat));
    transform: translate(-50%, -10px); z-index: 5; pointer-events: none;
    padding: 10px 16px; border-radius: 16px;
    background: var(--card); color: var(--ink);
    font-weight: 800; font-size: 15px; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .3s, transform .3s cubic-bezier(.2,1.4,.4,1);
    max-width: min(86vw, 360px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Results ---------- */
  .results {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: calc(66px + var(--sat)) 16px calc(16px + var(--sab));
    background: rgba(30,22,52,.0);
    opacity: 0; pointer-events: none;
    transition: opacity .35s, background .5s;
  }
  .results.show { opacity: 1; pointer-events: auto; background: rgba(30,22,52,.28); }
  body.res .pill, body.res .chain, body.res .toast { opacity: 0 !important; }
  .card {
    width: min(100%, 380px);
    max-height: calc(100vh - 82px - var(--sat) - var(--sab)); max-height: calc(100dvh - 82px - var(--sat) - var(--sab));
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column;
    background: var(--card);
    border-radius: 28px; padding: 22px 20px 18px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.7);
    transform: translateY(24px) scale(.96);
    transition: transform .45s cubic-bezier(.2,1.4,.4,1);
    position: relative;
  }
  .results.show .card { transform: translateY(0) scale(1); }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: 28px; pointer-events: none;
    background: radial-gradient(120% 60% at 50% -10%, rgba(255,214,232,.55), transparent 60%),
                radial-gradient(80% 40% at 100% 100%, rgba(201,184,239,.45), transparent 60%);
  }
  .card > * { position: relative; flex-shrink: 0; }
  .card h2 { margin: 0; text-align: center; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); font-weight: 800; }
  .card .title { text-align: center; font-size: 28px; font-weight: 900; margin: 2px 0 10px; line-height: 1.1; }
  .card .title .moon { color: #b8872e; }
  .badge {
    display: none; margin: 0 auto 10px; width: max-content;
    padding: 6px 14px; border-radius: 999px;
    background: linear-gradient(90deg, #ffd36a, #ffb3c7); color: #5a3a1a;
    font-weight: 900; font-size: 14px; letter-spacing: .5px;
    animation: badgePop .6s cubic-bezier(.2,1.6,.4,1);
  }
  .badge.show { display: block; }
  @keyframes badgePop { from { transform: scale(.5) rotate(-6deg); opacity: 0 } to { transform: none; opacity: 1 } }
  .score-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 2px; }
  .score-row .big { font-size: 56px; font-weight: 900; line-height: 1; letter-spacing: -1.5px; color: var(--ink); }
  .score-row svg { width: 30px; height: 36px; }
  .score-sub { text-align: center; font-size: 14px; color: var(--ink-soft); font-weight: 700; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: rgba(255,255,255,.55); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }
  .stat .v { font-size: 22px; font-weight: 900; line-height: 1.1; }
  .stat .k { font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }
  .breakdown { font-size: 13px; color: var(--ink-soft); font-weight: 700; text-align: center; margin: -6px 0 12px; min-height: 16px; }
  .goal { background: rgba(255,255,255,.55); border-radius: 16px; padding: 10px 12px; margin-bottom: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }
  .goal .g-t { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
  .goal .g-t { gap: 8px; }
  .goal .g-t span:last-child { color: var(--ink-soft); white-space: nowrap; }
  .bar { height: 10px; border-radius: 999px; background: rgba(63,51,80,.12); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #9fc39b, #ffe59a); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .unlock { display: none; align-items: center; gap: 10px; background: linear-gradient(90deg, rgba(255,229,154,.6), rgba(246,184,198,.6)); border-radius: 16px; padding: 10px 12px; margin-bottom: 14px; font-weight: 800; font-size: 14px; }
  .unlock.show { display: flex; }
  .unlock canvas { width: 46px; height: 46px; flex: none; }
  .btn-primary {
    display: block; width: 100%; min-height: 58px;
    border: 0; border-radius: 20px; cursor: pointer;
    background: linear-gradient(180deg, #ffe59a, #f7c35c);
    color: #4c3310; font-size: 21px; font-weight: 900; letter-spacing: .3px;
    box-shadow: 0 8px 0 #d9a23e, 0 14px 24px rgba(120,80,20,.25);
    transition: transform .12s, box-shadow .12s;
    font-family: inherit;
  }
  .btn-primary:active { transform: translateY(5px); box-shadow: 0 3px 0 #d9a23e, 0 6px 12px rgba(120,80,20,.25); }
  .btn-primary:focus-visible, .btn-ghost:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-ghost {
    flex: 1; min-height: 46px; border-radius: 16px; border: 0; cursor: pointer;
    background: rgba(63,51,80,.08); color: var(--ink); font-weight: 800; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
    transition: background .15s, transform .12s;
  }
  .btn-ghost:active { transform: scale(.97); background: rgba(63,51,80,.14); }
  .btn-ghost svg { width: 18px; height: 18px; }
  .btn-ghost.on { background: rgba(159,195,155,.4); box-shadow: inset 0 0 0 2px rgba(80,120,80,.35); }
  .btn-ghost { position: relative; }
  .btn-ghost .dot { position: absolute; top: 7px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #ff8fb4; box-shadow: 0 0 0 2px var(--card); display: none; }
  .btn-ghost .dot.show { display: block; }
  button.unlock { width: 100%; border: 0; text-align: left; color: var(--ink); font-family: inherit; cursor: pointer; }
  button.unlock:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  .unlock .u-sub { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-top: 2px; }
  .album {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    padding: calc(16px + var(--sat)) 16px calc(16px + var(--sab));
    background: rgba(30,22,52,.5); opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .album.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(100%, 420px); max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
    background: var(--card); border-radius: 26px; padding: 18px 16px 16px; box-shadow: var(--shadow);
    transform: translateY(20px) scale(.97); transition: transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .album.show .sheet { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheet-head h3 { margin: 0; font-size: 22px; font-weight: 900; }
  .sheet-head .sub { font-size: 13px; font-weight: 800; color: var(--ink-soft); margin-top: 2px; }
  .sheet .icon-btn { background: rgba(63,51,80,.12); color: var(--ink); box-shadow: none; backdrop-filter: none; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stk { position: relative; background: rgba(255,255,255,.6); border-radius: 16px; padding: 8px 6px 9px; text-align: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.85); }
  .stk canvas { width: 72px; height: 72px; display: block; margin: 0 auto 4px; }
  .stk .nm { font-size: 12px; font-weight: 900; line-height: 1.2; }
  .stk .how { font-size: 11px; font-weight: 700; color: var(--ink-soft); line-height: 1.25; margin-top: 2px; }
  .stk.locked { background: rgba(63,51,80,.06); }
  .stk.locked .nm { color: var(--ink-soft); }
  .stk .new { position: absolute; top: 6px; right: 6px; background: #ff8fb4; color: #fff; font-size: 10px; font-weight: 900; letter-spacing: .5px; padding: 2px 6px; border-radius: 999px; }
  .foot { text-align: center; font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-top: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-height: 720px) {   /* short phones: the next-round buttons come before rewards so they never fall below the fold */
    #againBtn, .card .btn-row { order: 1; }
    .card #unlock, .card .goal { order: 2; margin: 12px 0 0; }
    .card .foot { order: 3; }
  }
  @media (max-height: 640px) {
    .invite h1 { font-size: 26px; } .invite p { font-size: 15px; white-space: nowrap; } .invite p.hint { font-size: 13px; }
    .pill { min-height: 40px; font-size: 16px; padding: 6px 12px 6px 10px; } .icon-btn { width: 42px; height: 42px; }
    .card { padding: 16px 16px 14px; border-radius: 22px; }
    .score-row .big { font-size: 44px; }
    .stats { margin-bottom: 10px; }
    .card .title { font-size: 24px; margin-bottom: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pill, .chain, .toast, .card, .spark, .badge { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" role="application" aria-label="Moss and Moon garden. Tap or press Enter on a glowing seed to bloom it."></canvas>

<div class="hud">
  <div class="pill" id="scorePill" aria-live="polite" aria-atomic="true" title="Moon-drops this round">
    <svg class="drop" viewBox="0 0 18 22" aria-hidden="true"><path d="M9 1 C9 1 2 10 2 14 a7 7 0 0 0 14 0 C16 10 9 1 9 1Z" fill="#fff2c4" stroke="#f3c45c" stroke-width="1.2"/><circle cx="6.5" cy="13" r="1.6" fill="#fff"/></svg>
    <span id="score">0</span>
    <span class="label" id="scoreLabel">moon-drops</span>
  </div>
  <div class="hud-right">
    <button class="icon-btn" id="muteBtn" aria-label="Mute sound" aria-pressed="false" title="Sound">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <button class="icon-btn" id="restartBtn" aria-label="Start a new garden" title="New garden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
</div>

<div class="invite" id="invite" aria-hidden="true">
  <h1>Moss <span>&amp;</span> Moon</h1>
  <p>Wake the garden ✨</p>
  <p class="hint">tap the glowing seed</p>
</div>

<div class="chain" id="chain" aria-hidden="true"><div class="n" id="chainN">×1</div><div class="t">chain</div><div class="w" id="chainW"></div></div>
<div class="sparks" id="sparks" aria-label="Sparks remaining"><span class="lbl">Sparks</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="results" id="results" role="dialog" aria-modal="true" aria-labelledby="resTitle" aria-hidden="true">
  <div class="card">
    <h2 id="resKicker">The garden rests</h2>
    <div class="title" id="resTitle">A <span class="moon">lovely</span> bloom</div>
    <div class="badge" id="badge">✨ New personal best!</div>
    <div class="score-row">
      <svg viewBox="0 0 18 22" aria-hidden="true"><path d="M9 1 C9 1 2 10 2 14 a7 7 0 0 0 14 0 C16 10 9 1 9 1Z" fill="#ffe59a" stroke="#d9a23e" stroke-width="1.2"/><circle cx="6.5" cy="13" r="1.6" fill="#fff"/></svg>
      <div class="big" id="resScore">0</div>
    </div>
    <div class="score-sub">moon-drops this round</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="stats">
      <div class="stat"><div class="v" id="resChain">0</div><div class="k">best chain</div></div>
      <div class="stat"><div class="v" id="resBlooms">0</div><div class="k">blooms</div></div>
      <div class="stat"><div class="v" id="resBest">0</div><div class="k">your best</div></div>
    </div>
    <button class="unlock" id="unlock" type="button"><canvas id="unlockCanvas" width="92" height="92" aria-hidden="true"></canvas><span><span id="unlockText">A new friend has arrived.</span><span class="u-sub" id="unlockSub"></span></span></button>
    <div class="goal">
      <div class="g-t"><span id="goalName">Next: Moon Moth</span><span id="goalProg">0 / 150</span></div>
      <div class="bar"><i id="goalBar"></i></div>
    </div>
    <button class="btn-primary" id="againBtn">Grow again 🌱</button>
    <div class="btn-row">
      <button class="btn-ghost" id="dailyBtn" aria-pressed="false" title="Everyone gets the same garden today">

<script>
'use strict';
/* =====================================================================
   MOSS & MOON — a tiny watercolor garden you wake with a tap.
   Sections: Core utils · Storage · Audio · Art (scenery) · Characters ·

   ===================================================================== */

// ----------------------------------------------------------------- Core utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },

const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

}

const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ----------------------------------------------------------------- Storage (works without localStorage)
const Store = (() => {
  const KEY = 'mossmoon.v1';
  let mem = null;
  const defaults = () => ({ best: 0, bestChain: 0, drops: 0, rounds: 0, muted: false, unlocks: {}, daily: {}, seen: {}, stickers: {}, stickerNew: {} });
  function load() {
    if (mem) return mem;
    mem = defaults();
    try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(mem, JSON.parse(raw)); } catch (e) { /* storage blocked: stay in memory */ }
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* ignore */ } }
  return { get: load, save };
})();

// ----------------------------------------------------------------- Melodies (original pentatonic tunes, one per garden)
// Notes are pentatonic degrees: 0 = C4, 5 = C5, 10 = C6. Every tune resolves on 5 (home).
const MELODIES = [
  { name: 'Moonlit Lullaby', notes: [5, 6, 7, 6, 5, 4, 5, 3, 4, 5, 6, 8, 7, 6, 4, 5] },
  { name: 'Firefly Waltz',   notes: [3, 5, 7, 6, 5, 4, 5, 7, 9, 8, 7, 6, 7, 5, 4, 5] },
  { name: 'Mossy Steps',     notes: [5, 5, 7, 6, 4, 4, 6, 5, 3, 4, 5, 7, 6, 4, 6, 5] },
  { name: 'Petal Rain',      notes: [9, 8, 7, 6, 7, 6, 5, 4, 5, 4, 3, 2, 3, 4, 6, 5] },
  { name: 'Sleepy Pond',     notes: [3, 4, 5, 3, 4, 5, 7, 5, 6, 7, 8, 6, 7, 6, 4, 5] },
  { name: 'Star Garden',     notes: [5, 7, 9, 10, 9, 7, 8, 6, 7, 5, 6, 4, 5, 3, 4, 5] },
];

// ----------------------------------------------------------------- Audio (procedural, Web Audio)
const Audio = (() => {
  let ctx = null, master = null, pad = null, started = false;
  let muted = !!Store.get().muted;

    setMuted(m) { muted = m; Store.get().muted = m; Store.save(); if (master) master.gain.setTargetAtTime(m ? 0 : .8, now(), .05); },

    },
    nope() { tone(330, { type: 'triangle', dur: .1, vol: .05 }); tone(311, { type: 'triangle', dur: .12, vol: .05, delay: .07 }); },
    praise(level) { const run = [0, 1, 2, 3, 5].slice(0, 3 + Math.min(level, 2)); run.forEach((d, j) => chime(deg(7 + d + Math.min(level, 3)), j * .055, .1, .9)); },
    drop(i) { tone(1760 + (i % 3) * 220, { dur: .18, vol: .05, delay: i * .02 }); },
    miss() { tone(160, { type: 'triangle', dur: .18, vol: .07, bend: .8 }); },
    moon() { // rich flourish: arpeggio + shimmer

    creature() { chime(880, 0, .18, .7); chime(1174.7, .12, .18, .7); chime(1568, .24, .2, 1.1); },
    milestone() { [0, 4, 7, 12].forEach((k, i) => chime(SCALE[k] * 2, i * .07, .16, 1)); },

})();

// ----------------------------------------------------------------- Canvas + scenery
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
const Scene = { bg: null, grain: null, hills: [], grass: [], pollen: [], fireflies: [], stars: [], horizon: 0, pond: null, cottage: null, ripples: [] };

function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d');
  const img = g.createImageData(160, 160); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = 200 + Math.random() * 55; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
}

// Organic, slightly wobbly closed/open path through points
function wobbly(g, pts, jitter, closed, seed) {
  const r = makeRng(seed || 7);
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], jx = (r() - .5) * jitter, jy = (r() - .5) * jitter;
    if (i === 0) g.moveTo(p[0] + jx, p[1] + jy);

// Watercolor wash: several offset translucent layers + a darker bleed edge
function wash(g, pathFn, color, edge, layers = 3, spread = 3) {
  for (let i = 0; i < layers; i++) {
    g.save(); g.translate((i % 2 ? 1 : -1) * spread * (i * .5 + .5), (i < 2 ? 1 : -1) * spread * .6 * i);
    g.globalAlpha = 0.45 / layers + .28; g.fillStyle = color; pathFn(g, i); g.fill(); g.restore();
  }

}

function hillPoints(y0, amp, freq, phase, n = 14) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const x = (i / n) * W; pts.push([x, y0 + Math.sin(i * freq + phase) * amp + Math.cos(i * freq * 2.3 + phase) * amp * .35]); }
  pts.push([W + 20, H + 20], [-20, H + 20]);
  return pts;
}

function resize() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  W = vw; H = vh;
  const area = vw * vh;
  DPR = Math.min(window.devicePixelRatio || 1, area > 900000 ? 1.5 : 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScene();
  if (typeof Game !== 'undefined' && Game.seeds) Game.relayout();
}

function buildScene() {
  if (!Scene.grain) Scene.grain = makeGrain();
  const landscape = W > H * 1.1;
  Scene.horizon = H * (landscape ? 0.24 : 0.30);
  const bg = document.createElement('canvas'); bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
  const g = bg.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = makeRng(1234);

  // Sky: dusk wash — lavender → pink → butter at the horizon
  const sky = g.createLinearGradient(0, 0, 0, Scene.horizon * 1.25);
  sky.addColorStop(0, '#5d5a9c'); sky.addColorStop(.35, '#9a86c9'); sky.addColorStop(.68, '#e6a9c3'); sky.addColorStop(.92, '#ffd9a6'); sky.addColorStop(1, '#fff0c4');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // soft clouds
  for (let i = 0; i < 4; i++) {
    const cx = r() * W, cy = Scene.horizon * (0.3 + r() * .55), cw = W * (0.22 + r() * .25), ch = cw * .16;
    g.save(); g.globalAlpha = .16 + r() * .1; g.fillStyle = '#fff5ea'; g.filter = 'blur(6px)';
    g.beginPath(); g.ellipse(cx, cy, cw * .5, ch * .5, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(cx - cw * .2, cy - ch * .25, cw * .28, ch * .5, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(cx + cw * .18, cy - ch * .15, cw * .22, ch * .45, 0, 0, TAU); g.fill();
    g.restore();
  }

  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.save(); g.fillStyle = '#fff6d6'; g.shadowColor = 'rgba(255,240,200,.9)'; g.shadowBlur = 24; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill(); g.restore();
  g.save(); g.globalAlpha = .22; g.fillStyle = '#e8d3a8'; [[-.3, -.2, .22], [.25, .1, .16], [-.05, .4, .12], [.4, -.4, .1]].forEach(([a, b, c]) => { g.beginPath(); g.arc(mx + a * mr, my + b * mr, c * mr, 0, TAU); g.fill(); }); g.restore();

  const farY = Scene.horizon;
  wash(g, (c, i) => wobbly(c, hillPoints(farY + 4, H * .035, 1.9, 1.2, 10), 2, true, 11 + i), '#b7a8dc', null, 3, 2);
  g.save(); const mist = g.createLinearGradient(0, farY - 10, 0, farY + H * .08); mist.addColorStop(0, 'rgba(255,225,215,.0)'); mist.addColorStop(1, 'rgba(255,225,215,.55)'); g.fillStyle = mist; g.fillRect(0, farY - 10, W, H * .09); g.restore();
  wash(g, (c, i) => wobbly(c, hillPoints(farY + H * .05, H * .03, 2.6, 4.1, 10), 2, true, 21 + i), '#9fa0cf', null, 3, 2);
  // tiny far trees
  g.save(); g.fillStyle = 'rgba(110,105,170,.55)';
  for (let i = 0; i < 26; i++) { const x = r() * W, y = farY + H * .05 + Math.sin(x / W * 2.6 * 10 / W * W + 4.1) * 0; const h = 6 + r() * 10; g.beginPath(); g.moveTo(x - h * .35, y + 6); g.lineTo(x, y - h); g.lineTo(x + h * .35, y + 6); g.closePath(); g.fill(); }
  g.restore();

  // Mid hill (sage) with cottage
  const midY = farY + H * (landscape ? .05 : .06);
  wash(g, (c, i) => wobbly(c, hillPoints(midY, H * .028, 1.4, 2.2, 12), 3, true, 31 + i), '#8db98f', '#5f8a63', 3, 3);
  drawCottage(g, W * 0.80, midY + H * .012, Math.min(W, H) * 0.11);
  drawTree(g, W * 0.13, midY - H * .005, Math.min(W, H) * .11, r);
  drawTree(g, W * 0.93, midY + H * .02, Math.min(W, H) * .07, r);

  // Main meadow (the play field): warm mossy green with a lighter path of light under the moon
  const meadowY = midY + H * (landscape ? .04 : .045);
  wash(g, (c, i) => wobbly(c, hillPoints(meadowY, H * .02, 1.1, .6, 12), 4, true, 41 + i), '#a9cc93', '#6f9a66', 4, 3);
  const glow = g.createRadialGradient(W * .5, H * .66, 10, W * .5, H * .66, W * .75); glow.addColorStop(0, 'rgba(255,245,200,.22)'); glow.addColorStop(1, 'rgba(255,245,200,0)');
  g.fillStyle = glow; g.fillRect(0, meadowY - 20, W, H);
  // mossy texture: dapples
  g.save();
  for (let i = 0; i < 160; i++) { const x = r() * W, y = meadowY + r() * (H - meadowY); const rr = 4 + r() * 14; g.globalAlpha = .07 + r() * .09; g.fillStyle = r() < .5 ? '#7fae73' : '#d6e6a8'; g.beginPath(); g.ellipse(x, y, rr * 1.4, rr * .6, r() * 3, 0, TAU); g.fill(); }
  g.restore();
  // Pond (bottom-left)
  Scene.pond = { x: landscape ? W * .12 : W * 0.2, y: H * 0.905, rx: Math.min(W, H * .6) * 0.17, ry: H * 0.035 };
  const p = Scene.pond;
  wash(g, (c) => { c.beginPath(); c.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, TAU); }, '#8fc5e8', '#6aa4cc', 3, 2);
  g.save(); g.globalAlpha = .5; const pg = g.createLinearGradient(0, p.y - p.ry, 0, p.y + p.ry); pg.addColorStop(0, '#c7e6f7'); pg.addColorStop(1, '#7fb6dc'); g.fillStyle = pg; g.beginPath(); g.ellipse(p.x, p.y, p.rx * .92, p.ry * .85, 0, 0, TAU); g.fill(); g.restore();
  // stones + mushrooms + flowers scattered (decor)
  for (let i = 0; i < 9; i++) { const x = r() * W, y = meadowY + H * .02 + r() * (H - meadowY - H * .1); if (dist(x, y, p.x, p.y) < p.rx * 1.3) continue; drawStone(g, x, y, 5 + r() * 9, r); }
  for (let i = 0; i < 7; i++) { const x = r() * W, y = meadowY + H * .03 + r() * (H - meadowY - H * .12); if (dist(x, y, p.x, p.y) < p.rx * 1.3) continue; drawMushroom(g, x, y, 6 + r() * 7, r); }
  // foreground grass tufts (static layer), plus a living set for sway
  Scene.grass = [];
  for (let i = 0; i < 230; i++) { const x = r() * W, y = meadowY + r() * (H - meadowY); if (dist(x, y, p.x, p.y) < p.rx * 1.05) continue; Scene.grass.push({ x, y, h: 6 + r() * 9 + (y / H) * 10, w: 1.2 + r() * 1.4, ph: r() * TAU, lean: (r() - .5) * 8, c: r() < .4 ? 'rgba(104,152,92,.75)' : r() < .7 ? 'rgba(143,185,122,.8)' : 'rgba(186,214,140,.75)' }); }
  // Paper grain overlay
  g.save(); g.globalAlpha = .13; g.globalCompositeOperation = 'multiply'; const pat = g.createPattern(Scene.grain, 'repeat'); g.fillStyle = pat; g.fillRect(0, 0, W, H); g.restore();
  // vignette
  g.save(); const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .45, W / 2, H / 2, Math.max(W, H) * .8); vg.addColorStop(0, 'rgba(60,40,90,0)'); vg.addColorStop(1, 'rgba(60,40,90,.32)'); g.fillStyle = vg; g.fillRect(0, 0, W, H); g.restore();

  Scene.bg = bg; Scene.meadowY = meadowY; Scene.midY = midY;
  Scene.pollen = []; for (let i = 0; i < (REDUCED ? 14 : 36); i++) Scene.pollen.push({ x: Math.random() * W, y: Math.random() * H, s: .8 + Math.random() * 1.8, ph: Math.random() * TAU, v: 6 + Math.random() * 10 });
  Scene.fireflies = []; for (let i = 0; i < (REDUCED ? 6 : 14); i++) Scene.fireflies.push({ x: Math.random() * W, y: meadowY - 40 + Math.random() * (H - meadowY), ph: Math.random() * TAU, a: Math.random() * TAU, sp: 8 + Math.random() * 14 });
}

function drawCottage(g, x, y, s) {
  const r = makeRng(99);
  // walls
  wash(g, (c) => wobbly(c, [[x - s * .5, y], [x - s * .5, y - s * .55], [x + s * .5, y - s * .55], [x + s * .5, y]], 2, true, 5), '#f4e3c9', '#b99b7a', 3, 1.5);
  // roof (soft mossy pink)
  wash(g, (c) => wobbly(c, [[x - s * .62, y - s * .52], [x, y - s * 1.0], [x + s * .62, y - s * .52]], 2, true, 6), '#d79aa4', '#9e5f6e', 3, 1.5);
  g.save(); g.fillStyle = 'rgba(140,180,120,.55)'; g.beginPath(); g.ellipse(x - s * .2, y - s * .75, s * .18, s * .07, -.5, 0, TAU); g.fill(); g.restore();
  // chimney
  g.fillStyle = '#c9a98f'; g.fillRect(x + s * .25, y - s * .95, s * .12, s * .28);
  // door + windows (window glow drawn live when unlocked)
  g.fillStyle = '#8b6a4f'; g.beginPath(); g.roundRect ? g.roundRect(x - s * .1, y - s * .3, s * .2, s * .3, s * .08) : g.rect(x - s * .1, y - s * .3, s * .2, s * .3); g.fill();
  Scene.cottage = { x, y, s, windows: [[x - s * .33, y - s * .38], [x + s * .33, y - s * .38]] };
  g.fillStyle = '#6f5d8f'; Scene.cottage.windows.forEach(([wx, wy]) => { g.fillRect(wx - s * .07, wy - s * .07, s * .14, s * .14); });
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; Scene.cottage.windows.forEach(([wx, wy]) => { g.beginPath(); g.moveTo(wx, wy - s * .07); g.lineTo(wx, wy + s * .07); g.moveTo(wx - s * .07, wy); g.lineTo(wx + s * .07, wy); g.stroke(); });
  // bush beside
  wash(g, (c) => { c.beginPath(); c.ellipse(x + s * .62, y - s * .06, s * .24, s * .16, 0, 0, TAU); }, '#7fae73', '#5a8a55', 2, 1.5);
}
function drawTree(g, x, y, s, r) {
  g.fillStyle = '#8a6a55'; g.beginPath(); g.moveTo(x - s * .07, y); g.lineTo(x - s * .04, y - s * .45); g.lineTo(x + s * .04, y - s * .45); g.lineTo(x + s * .07, y); g.closePath(); g.fill();
  const cols = ['#f4b6c7', '#f7c6d2', '#e9a2b8'];
  for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, rr = s * (.28 + r() * .14); const cx = x + Math.cos(a) * s * .22, cy = y - s * .6 + Math.sin(a) * s * .17; wash(g, (c) => { c.beginPath(); c.ellipse(cx, cy, rr, rr * .8, 0, 0, TAU); }, r.pick(cols), null, 2, 1.5); }
  wash(g, (c) => { c.beginPath(); c.ellipse(x, y - s * .62, s * .3, s * .24, 0, 0, TAU); }, '#fbd0dc', '#c98aa1', 2, 1);
}
function drawStone(g, x, y, s, r) { wash(g, (c) => { c.beginPath(); c.ellipse(x, y, s, s * .62, (r() - .5) * .6, 0, 0, TAU); }, '#b9b4c6', '#8b84a0', 2, 1); g.save(); g.globalAlpha = .4; g.fillStyle = '#9ec98c'; g.beginPath(); g.ellipse(x - s * .3, y - s * .3, s * .45, s * .22, 0, 0, TAU); g.fill(); g.restore(); }
function drawMushroom(g, x, y, s, r) {
  g.fillStyle = '#f7ecd8'; g.beginPath(); g.roundRect ? g.roundRect(x - s * .22, y - s * .5, s * .44, s * .55, s * .15) : g.rect(x - s * .22, y - s * .5, s * .44, s * .55); g.fill();
  wash(g, (c) => { c.beginPath(); c.ellipse(x, y - s * .5, s * .62, s * .38, 0, Math.PI, TAU); c.closePath(); }, r() < .5 ? '#f08a8a' : '#f2b16b', '#b85a5a', 2, 1);
  g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + (r() - .5) * s * .8, y - s * .6 - r() * s * .18, s * .07 + r() * s * .05, 0, TAU); g.fill(); }
}

// ---- live scenery layers (called every frame) ----
function drawSkyLife(t) {
  ctx.save();
  for (const s of Scene.stars) { const a = .35 + .65 * (0.5 + 0.5 * Math.sin(t * 1.6 + s.p)); ctx.globalAlpha = a * .9; ctx.fillStyle = '#fff8e6'; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, TAU); ctx.fill(); }
  ctx.restore();
  // cottage windows glow when unlocked; chimney smoke always
  const c = Scene.cottage;
  if (c) {
    if (Store.get().unlocks.cottage) { ctx.save(); const pulse = .75 + .25 * Math.sin(t * 2.2); ctx.fillStyle = `rgba(255,214,120,${0.85 * pulse})`; ctx.shadowColor = 'rgba(255,200,100,.9)'; ctx.shadowBlur = 14; c.windows.forEach(([wx, wy]) => ctx.fillRect(wx - c.s * .07, wy - c.s * .07, c.s * .14, c.s * .14)); ctx.restore(); }
    if (!REDUCED) { ctx.save(); ctx.fillStyle = 'rgba(255,250,240,.35)'; for (let i = 0; i < 4; i++) { const k = (t * .35 + i * .25) % 1; ctx.globalAlpha = (1 - k) * .4; ctx.beginPath(); ctx.arc(c.x + c.s * .31 + Math.sin(k * 6 + i) * c.s * .06, c.y - c.s * .98 - k * c.s * .5, c.s * (.04 + k * .09), 0, TAU); ctx.fill(); } ctx.restore(); }
  }
}
function drawWater(t) {
  const p = Scene.pond; if (!p) return;
  ctx.save(); ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx * .92, p.ry * .85, 0, 0, TAU); ctx.clip();
  // moon reflection + moving highlights
  ctx.globalAlpha = .35; ctx.fillStyle = '#fff4d0'; ctx.beginPath(); ctx.ellipse(p.x + p.rx * .25, p.y - p.ry * .1 + Math.sin(t * 1.3) * 1.5, p.rx * .14, p.ry * .3, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) { const k = ((t * .25 + i * .25) % 1); ctx.globalAlpha = (1 - k) * .5; ctx.beginPath(); ctx.ellipse(p.x - p.rx * .2 + i * p.rx * .15, p.y + p.ry * .1, p.rx * (.15 + k * .6), p.ry * (.12 + k * .55), 0, 0, TAU); ctx.stroke(); }
  for (const rp of Scene.ripples) { const k = rp.t; ctx.globalAlpha = (1 - k) * .7; ctx.beginPath(); ctx.ellipse(rp.x, rp.y, 4 + k * p.rx * .8, 2 + k * p.ry * .8, 0, 0, TAU); ctx.stroke(); }
  ctx.restore();
}
function drawGrass(t, pulses) {
  const windBase = REDUCED ? 0 : Math.sin(t * .9) * .5 + Math.sin(t * 2.3) * .25;
  ctx.save(); ctx.lineCap = 'round';
  for (const b of Scene.grass) {
    let sway = windBase * 2.2 + (REDUCED ? 0 : Math.sin(t * 1.7 + b.ph) * 1.6);
    // bloom pulses push grass outward
    for (const p of pulses) { const d = dist(b.x, b.y, p.x, p.y); const edge = p.r - d; if (edge > -40 && edge < 30) sway += ((b.x - p.x) / (d + 1)) * 9 * (1 - p.t); }
    ctx.strokeStyle = b.c; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(b.x + b.lean * .3 + sway * .4, b.y - b.h * .6, b.x + b.lean + sway, b.y - b.h); ctx.stroke();
  }
  ctx.restore();
}
function drawAir(t, dt) {
  ctx.save();
  for (const p of Scene.pollen) {
    p.x += (Math.sin(t * .7 + p.ph) * 8 + 4) * dt; p.y -= p.v * dt * .35; p.y += Math.sin(t * 1.1 + p.ph) * 4 * dt;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } if (p.x > W + 10) p.x = -10;
    ctx.globalAlpha = .25 + .35 * (0.5 + 0.5 * Math.sin(t * 2 + p.ph)); ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
  }
  for (const f of Scene.fireflies) {
    f.a += (Math.sin(t * .8 + f.ph) * .9) * dt; f.x += Math.cos(f.a) * f.sp * dt; f.y += Math.sin(f.a) * f.sp * .5 * dt;
    if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10; if (f.y < Scene.meadowY - 60) f.y = Scene.meadowY - 60; if (f.y > H) f.y = Scene.meadowY;
    const a = Math.max(0, Math.sin(t * 2.4 + f.ph * 3)); if (a < .05) continue;
    ctx.globalAlpha = a * .9; ctx.fillStyle = '#eaffb0'; ctx.shadowColor = '#d6ff7a'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ----------------------------------------------------------------- Characters (one reusable renderer per creature)
// Shared facial vocabulary so every creature belongs to the same world.
function eyes(g, x, y, s, gap, mood, blink, lookX = 0, lookY = 0) {
  // s: eye radius. mood: sleep | awake | happy | wow
  const ex = [x - gap, x + gap];
  if (mood === 'sleep') {
    g.strokeStyle = '#3f3350'; g.lineWidth = Math.max(1.4, s * .28); g.lineCap = 'round';
    ex.forEach(cx => { g.beginPath(); g.arc(cx, y - s * .1, s * .9, Math.PI * .15, Math.PI * .85); g.stroke(); });
    return;
  }
  if (mood === 'happy') { // closed, upward arcs
    g.strokeStyle = '#3f3350'; g.lineWidth = Math.max(1.4, s * .3); g.lineCap = 'round';
    ex.forEach(cx => { g.beginPath(); g.arc(cx, y + s * .35, s * .9, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); });
    return;
  }
  const open = blink; // 0..1
  ex.forEach((cx, i) => {
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(cx, y, s * 1.05, s * 1.15 * open + .2, 0, 0, TAU); g.fill();
    if (open > .25) {
      const px = cx + lookX * s * .3, py = y + s * .05 + lookY * s * .3;
      g.fillStyle = '#3f3350'; g.beginPath(); g.ellipse(px, py, s * .72, s * .85 * open, 0, 0, TAU); g.fill();
      if (mood === 'wow') { g.fillStyle = '#fff'; star(g, px, py, s * .42, 5); g.fill(); }
      g.fillStyle = 'rgba(255,255,255,.95)'; g.beginPath(); g.arc(px - s * .25, py - s * .32, s * .26, 0, TAU); g.fill();
      g.beginPath(); g.arc(px + s * .22, py + s * .25, s * .12, 0, TAU); g.fill();
    }
  });
}
function star(g, x, y, r, n) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }
function blush(g, x, y, s, gap) { g.fillStyle = 'rgba(246,150,170,.45)'; [x - gap, x + gap].forEach(cx => { g.beginPath(); g.ellipse(cx, y, s * .9, s * .5, 0, 0, TAU); g.fill(); }); }
function outline(g, color = 'rgba(70,55,80,.55)', w = 1.6) { g.strokeStyle = color; g.lineWidth = w; g.lineJoin = 'round'; g.stroke(); }

const Chars = {
  // MOCHI MOSSLING — round moss bun, leaf sprout, forever sleepy.
  mochi(g, x, y, s, st, t) {
    const breathe = 1 + Math.sin(t * 2.1) * .022;
    const sq = st.squash || 0; // -1..1 squash/stretch
    g.save(); g.translate(x, y + (st.hop || 0)); g.scale((1 + sq * .18) * breathe, (1 - sq * .18) / breathe);
    // shadow
    g.fillStyle = 'rgba(60,70,40,.18)'; g.beginPath(); g.ellipse(0, s * .95, s * 1.05, s * .22, 0, 0, TAU); g.fill();
    // body
    g.beginPath(); g.ellipse(0, 0, s, s * .92, 0, 0, TAU);
    g.fillStyle = '#a3c88c'; g.fill(); outline(g, 'rgba(70,100,60,.6)', 1.8);
    // moss tufts
    g.fillStyle = '#8fb973'; [[-.75, -.45, .28], [.7, -.5, .26], [-.3, -.85, .22], [.35, -.86, .2]].forEach(([a, b, c]) => { g.beginPath(); g.arc(a * s, b * s, c * s, 0, TAU); g.fill(); });
    // belly
    g.fillStyle = '#d9e9b4'; g.beginPath(); g.ellipse(0, s * .35, s * .55, s * .42, 0, 0, TAU); g.fill();
    // leaf sprout
    g.save(); g.translate(0, -s * .9); g.rotate(Math.sin(t * 1.6) * .12 + (st.wiggle || 0));
    g.strokeStyle = '#5f8f4e'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(s * .05, -s * .25, s * .1, -s * .45); g.stroke();
    g.fillStyle = '#8ed07a'; g.beginPath(); g.moveTo(s * .1, -s * .45); g.quadraticCurveTo(s * .55, -s * .75, s * .5, -s * .35); g.quadraticCurveTo(s * .3, -s * .3, s * .1, -s * .45); g.fill(); outline(g, 'rgba(60,100,50,.5)', 1.2);
    g.restore();
    if (st.crown) { g.save(); g.shadowColor = 'rgba(255,220,120,.9)'; g.shadowBlur = 10; g.fillStyle = '#ffe59a'; star(g, -s * .5, -s * 1.02, s * .24, 5); g.fill(); outline(g, 'rgba(190,140,40,.6)', 1); g.restore(); }
    // face
    eyes(g, 0, -s * .1, s * .2, s * .34, st.mood, st.blink, st.lookX || 0, st.lookY || 0);
    blush(g, 0, s * .12, s * .2, s * .55);
    g.strokeStyle = '#3f3350'; g.lineWidth = 1.5; g.lineCap = 'round'; g.beginPath();
    if (st.mood === 'sleep') { g.arc(0, s * .2, s * .07, 0, TAU); } // tiny "o"
    else if (st.mood === 'wow') { g.ellipse(0, s * .25, s * .09, s * .13, 0, 0, TAU); }
    else { g.arc(0, s * .12, s * .16, Math.PI * .15, Math.PI * .85); }
    g.stroke();
    g.restore();
    // zzz when asleep
    if (st.mood === 'sleep') { g.save(); g.fillStyle = 'rgba(255,250,230,.9)'; g.font = `700 ${Math.round(s * .42)}px sans-serif`; g.textAlign = 'center'; for (let i = 0; i < 2; i++) { const k = ((t * .5 + i * .5) % 1); g.globalAlpha = (1 - k) * .9; g.fillText('z', x + s * .9 + k * s * .5 + i * s * .2, y - s * .8 - k * s * 1.1); } g.restore(); }
  },
  // PIP — cream fluff with long ears, peeks from behind the moonflower.
  pip(g, x, y, s, st, t) {
    g.save(); g.translate(x, y);
    const tilt = Math.sin(t * 1.3) * .06 + (st.tilt || 0); g.rotate(tilt);
    // ears
    [[-1, -.35], [1, -.1]].forEach(([d, extra]) => {
      g.save(); g.translate(d * s * .42, -s * .8); g.rotate(d * .35 + Math.sin(t * 2 + d) * .08 + (st.earWave ? Math.sin(t * 9) * .3 : 0) * (d > 0 ? 1 : 0));
      g.beginPath(); g.ellipse(0, -s * .55, s * .22, s * .62, 0, 0, TAU); g.fillStyle = '#fbefe1'; g.fill(); outline(g, 'rgba(120,90,90,.55)', 1.6);
      g.fillStyle = '#f7bfcb'; g.beginPath(); g.ellipse(0, -s * .52, s * .11, s * .42, 0, 0, TAU); g.fill();
      g.restore();
    });
    // head/body blob
    g.beginPath(); g.ellipse(0, 0, s * .95, s * .88, 0, 0, TAU); g.fillStyle = '#fbefe1'; g.fill(); outline(g, 'rgba(120,90,90,.55)', 1.8);
    // fluff
    g.fillStyle = '#fff8ef'; [[-.6, .4], [0, .55], [.6, .4]].forEach(([a, b]) => { g.beginPath(); g.arc(a * s, b * s, s * .3, 0, TAU); g.fill(); });
    eyes(g, 0, -s * .05, s * .22, s * .36, st.mood, st.blink, st.lookX || 0, st.lookY || 0);
    blush(g, 0, s * .22, s * .2, s * .56);
    // nose + mouth
    g.fillStyle = '#e39aa8'; g.beginPath(); g.ellipse(0, s * .22, s * .08, s * .06, 0, 0, TAU); g.fill();
    g.strokeStyle = '#3f3350'; g.lineWidth = 1.4; g.lineCap = 'round'; g.beginPath(); g.moveTo(-s * .12, s * .34); g.quadraticCurveTo(0, s * .44, s * .12, s * .34); g.stroke();
    g.restore();
  },
  // NIB — a tiny moon snail by the pond. Hides in a lavender shell; peeks out when you catch the wave.
  nib(g, x, y, s, st, t) {
    const out = st.out == null ? 1 : clamp(st.out, 0, 1);
    g.save(); g.translate(x, y + (st.hop || 0));
    g.fillStyle = 'rgba(40,60,50,.18)'; g.beginPath(); g.ellipse(s * .1, s * .14, s * (.75 + out * .45), s * .2, 0, 0, TAU); g.fill();
    const hx = -s * .05 + out * s * .85, hy = -s * .2 - out * s * .2, hr = s * .27 * Math.min(1, .45 + out * .8);
    if (out > .04) {
      // foot + head
      g.fillStyle = '#f6e7d2';
      g.beginPath(); g.ellipse(out * s * .3, s * .02, s * (.55 + out * .4), s * .17, 0, 0, TAU); g.fill(); outline(g, 'rgba(140,110,90,.5)', 1.3);
      g.beginPath(); g.ellipse(hx, hy, hr, hr * 1.05, 0, 0, TAU); g.fill(); outline(g, 'rgba(140,110,90,.5)', 1.3);
      // eye stalks
      const sl = s * (.12 + .3 * out), wob = REDUCED ? 0 : Math.sin(t * 3) * .08;
      [[-1, .1], [1, -.08]].forEach(([d, w]) => {
        const ex = hx + d * hr * .45 + Math.sin(w + wob) * sl * .4, ey = hy - hr * .6 - sl;
        g.strokeStyle = '#ead6bd'; g.lineWidth = Math.max(2, s * .09); g.lineCap = 'round';
        g.beginPath(); g.moveTo(hx + d * hr * .35, hy - hr * .5); g.lineTo(ex, ey); g.stroke();
        const er = s * .12;
        if (st.mood === 'happy') { g.strokeStyle = '#3f3350'; g.lineWidth = Math.max(1.3, er * .35); g.beginPath(); g.arc(ex, ey + er * .3, er * .8, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
        else {
          const open = st.blink == null ? 1 : st.blink;
          g.fillStyle = '#fff'; g.beginPath(); g.ellipse(ex, ey, er, er * open + .2, 0, 0, TAU); g.fill(); outline(g, 'rgba(140,110,90,.45)', 1);
          if (open > .3) { g.fillStyle = '#3f3350'; g.beginPath(); g.arc(ex + (st.lookX || 0) * er * .3, ey + er * .1, er * .62, 0, TAU); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(ex - er * .25, ey - er * .25, er * .25, 0, TAU); g.fill(); }
        }
      });
      if (out > .5) {
        blush(g, hx, hy + hr * .25, hr * .22, hr * .55);
        g.strokeStyle = '#3f3350'; g.lineWidth = 1.3; g.lineCap = 'round'; g.beginPath(); g.arc(hx, hy + hr * .15, hr * .22, Math.PI * .15, Math.PI * .85); g.stroke();
      }
    }
    // shell (on top): lavender wash with a spiral; golden "moon-shell" variant glows

Game.reach = (s, seeds) => Game.reachSet(s, seeds).size;

  for (const s of Game.seeds) { s.x = f.x0 + s.u * f.w; s.y = f.y0 + s.v * f.w; s.r = Game.U * (s.type === 'moon' ? .075 : .046); }

Game.placeCreatures = function () {

    const x = first.x + dx * Game.U, y = first.y + dy * Game.U;

Game.newRound = function () {

  Game.layoutField();

  Game.petals.length = 0; Game.pulses.length = 0; Game.floats.length = 0; Game.sparkles.length = 0; Scene.ripples.length = 0;
  Game.sparks = 3; Game.score = 0; Game.chain = 0; Game.bestChain = 0; Game.blooms = 0; Game.moons = 0; Game.chainActive = false;

  Game.catches = 0; Game.perfects = 0; Game.sparksSaved = 0; Game.tut = null;

// ----------------------------------------------------------------- Input → bloom
Game.hitSeed = function (x, y) {
  let best = null, bd = 1e9;
  for (const s of Game.seeds) { const hr = Math.max(s.r * 1.7, 30); const d = dist(x, y, s.x, s.y); if (d < hr && d < bd) { bd = d; best = s; } }
  return best;
};
Game.tapAt = function (x, y) {
  if (Game.state === 'results') return;
  Audio.unlock();
  const s = Game.hitSeed(x, y);
  if (!s) { Game.touchGround(x, y); return; }
  Game.tapSeed(s);
};
Game.tapSeed = function (s) {
  if (s.state === 'bloom') { // free, playful: wiggle + petal puff
    s.tapScale = 1.25; s.spin += .35; Game.puff(s.x, s.y, 5, s.pal.p); Audio.drop(1); return;
  }
  if (s.state !== 'sleep') return;
  if (Game.chainActive) {
    if (s.catchT > 0) { Game.catchSeed(s); return; }
    s.nopeT = .35; s.grumpyT = 1.4; Audio.nope();   // tapped too early: a head-shake, no spark spent, and it won't be caught for a moment
    if (!Game.nopeHinted) { Game.nopeHinted = true; UI.toast('Not yet! Tap seeds while the light shimmers on them ✨', 2.6); }
    return;
  }
  if (Game.sparks <= 0) { Audio.miss(); UI.toast('No sparks left — the garden is settling 🌙'); return; }
  Game.sparks--; Game.tapCount++;
  if (Game.state === 'idle') { Game.state = 'playing'; UI.hideInvite(); }
  for (const o of Game.seeds) o.hint = false; Game.anyHint = false;
  Audio.tap();
  s.state = 'bud'; s.pressT = .001; s.bloomAt = .13; s.chainIdx = 0; // anticipation squish, then bloom
  Game.chain = 0; Game.chainActive = true; Game.settleT = 0;
  UI.sparks();
  // Mochi wakes on the very first tap
  if (Game.mochi.mood === 'sleep') { Game.mochi.mood = 'wow'; Game.mochi.hopV = -260; Game.mochi.wowT = 1.1; }
};
Game.touchGround = function (x, y) {
  const p = Scene.pond;
  const nb = Game.nib; if (dist(x, y, nb.x, nb.y - Game.U * .03) < Math.max(34, Game.U * .08)) { Game.nibPeek(2.2, 'awake'); nb.hopV = -140; Audio.drop(3); return; }
  if (p && dist(x, y, p.x, p.y) < p.rx * 1.1) { Scene.ripples.push({ x, y, t: 0 }); Audio.drop(2); return; }
  Game.pulses.push({ x, y, r: 0, R: Game.U * .12, t: 0, dur: .45, soft: true });
  Game.puff(x, y, 3, '#fff6d8', true);
};
Game.catchSeed = function (s) {
  const perfect = s.catchT <= PERFECT_AT;
  s.catchT = 0; s.state = 'bud'; s.bloomAt = .05; s.pressT = .001; s.caught = true; s.perfect = perfect;
  Game.catches++; if (perfect) Game.perfects++;
  Game.settleT = 0;
  Audio.catch(perfect);
  Game.floats.push({ x: s.x, y: s.y - s.r * 2.6, text: perfect ? 'Perfect!' : 'Caught!', t: 0, big: perfect, label: true, col: perfect ? '#ffd6e8' : '#effff0' });
  for (let i = 0; i < (REDUCED ? 3 : perfect ? 12 : 6); i++) Game.sparkles.push({ x: s.x, y: s.y, vx: (Math.random() - .5) * 140, vy: -30 - Math.random() * 110, t: 0, life: .8 + Math.random() * .6, s: 1.6 + Math.random() * 2.4 });
  Game.nibPeek(1.4, perfect ? 'happy' : 'awake');
  if (Game.mochi.mood !== 'sleep') { Game.mochi.hopV = -150; Game.mochi.lookX = clamp((s.x - Game.mochi.x) / W * 3, -1, 1); }

};
// First-ever catchable seed: slow time right down and say what to do, once or twice until it clicks.
Game.tutWanted = () => { const st = Store.get(); return !Game.daily && !st.seen.catchTut && (st.seen.catchTries || 0) < 2; };
Game.startTut = function (s) { Game.tut = s; UI.toast('Tap the shimmering seed while the light touches it ✨', 4.5); };
Game.endTut = function (ok, perfect) {
  const st = Store.get(); Game.tut = null;
  if (ok) { st.seen.catchTut = true; UI.toast(perfect ? 'Perfect! Tap just as the ring closes for double ✨' : 'Caught it! Catches keep your chain growing 🌱', 3); }
  else { st.seen.catchTries = (st.seen.catchTries || 0) + 1; UI.toast('So close! Shimmering seeds can join your chain', 2.6); }
  Store.save();
};
Game.nibPeek = function (dur, mood) { const n = Game.nib; n.target = 1; n.peekT = Math.max(n.peekT, dur); n.mood = mood || 'awake'; };
Game.puff = function (x, y, n, col, tiny) {
  for (let i = 0; i < n; i++) {
    if (Game.petals.length >= MAX_PARTICLES) Game.petals.shift();
    const a = Math.random() * TAU, sp = tiny ? 30 + Math.random() * 40 : 60 + Math.random() * 120;
    Game.petals.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, rot: Math.random() * TAU, vr: (Math.random() - .5) * 6, s: tiny ? 2 : 3 + Math.random() * 3.5, col, t: 0, life: 1.4 + Math.random() * 1.2, sw: Math.random() * TAU });
  }
};
Game.bloom = function (s) {
  s.state = 'bloom'; s.bloomK = 0; s.pressT = 0; s.catchT = 0;
  Game.blooms++; Game.chain++; s.chainIdx = Game.chain; Game.lastBloom = s;
  if (Game.chain > Game.bestChain) Game.bestChain = Game.chain;
  // scoring: the n-th bloom of a chain is worth n moon-drops, uncapped, so one long chain beats several short ones.
  let pts = Game.chain;
  if (s.golden) pts *= 2;
  if (s.perfect) pts *= 2;
  if (s.type === 'moon') pts += 25;
  if (s.type === 'lantern') pts += 5;
  if (s.type === 'bell') pts += 3;
  Game.score += pts;
  Game.floats.push({ x: s.x, y: s.y - s.r * 1.4, text: '+' + pts, t: 0, big: pts >= 10, col: s.type === 'moon' ? '#fff2c4' : s.golden || s.perfect ? '#ffe59a' : '#fff' });

    Game.pulses.push({ x: s.x, y: s.y, r: 0, R: 1, out: Game.U * .46, t: -.5, dur: 1, bell: true, src: s });   // second ring: wakes nothing, makes a wide area catchable
  }
  if (s.type === 'lantern') { for (let i = 0; i < 3; i++) Scene.fireflies.push({ x: s.x, y: s.y, ph: Math.random() * TAU, a: Math.random() * TAU, sp: 12 + Math.random() * 12 }); if (Scene.fireflies.length > 40) Scene.fireflies.splice(0, Scene.fireflies.length - 40); }
  // creature reactions

};
Game.magicMoment = function (s) {

// ----------------------------------------------------------------- Update
Game.update = function (dt, t) {
  // slow-motion recovery
  if (Game.tut && (Game.tut.state !== 'sleep' || Game.state !== 'playing')) Game.tut = null;   // the chain woke it by itself: wait for the next one
  if (Game.tut) Game.timeScale = lerp(Game.timeScale, .3, 1 - Math.pow(.0005, dt));
  else if (Game.slowT > 0) { Game.slowT -= dt; if (Game.slowT <= 0) Game.slowT = 0; Game.timeScale = lerp(Game.timeScale, Game.slowT > 0 ? .3 : 1, 1 - Math.pow(.001, dt)); }
  else if (Game.timeScale < 1) Game.timeScale = Math.min(1, Game.timeScale + dt * 1.6);
  if (Game.cam.k > 0 && Game.slowT <= 0) Game.cam.k = Math.max(0, Game.cam.k - dt * 1.4);
  const gdt = dt * Game.timeScale; // game-time delta
  let pending = false;
  for (const s of Game.seeds) {
    if (s.nopeT > 0) s.nopeT = Math.max(0, s.nopeT - dt);
    if (s.grumpyT > 0) s.grumpyT = Math.max(0, s.grumpyT - dt);
    if (s.state === 'bud') { pending = true; s.bloomAt -= gdt; if (s.pressT > 0) s.pressT += gdt; if (s.bloomAt <= 0) Game.bloom(s); }
    else if (s.state === 'sleep' && s.catchT > 0) { pending = true; s.catchT -= gdt / CATCH_WIN; if (s.catchT <= 0) { s.catchT = 0; if (Game.tut === s) Game.endTut(false); } }
    else if (s.state === 'bloom') { s.bloomK = Math.min(1.6, s.bloomK + gdt * 2.4); s.tapScale += (1 - s.tapScale) * (1 - Math.pow(.0005, dt)); s.spin *= Math.pow(.02, dt); }
  }
  for (let i = Game.pulses.length - 1; i >= 0; i--) {
    const p = Game.pulses[i]; p.t += gdt / p.dur;
    if (p.bell && p.t >= 0 && !p.fired) { p.fired = true; Audio.echo(Game.chain); }
    if (p.t < 0) { pending = true; continue; }
    const prevR = p.r; p.r = (p.out || p.R) * ease.outCubic(Math.min(1, p.t));
    if (p.out && Game.chainActive && p.t >= 0) for (const o of Game.seeds) {   // the travelling ring makes seeds beyond its wake radius catchable
      if (o.state !== 'sleep' || o.catchT > 0 || o.grumpyT > 0) continue;
      const d = dist(p.x, p.y, o.x, o.y);
      if (d > p.R && d <= p.r && d > prevR) { o.catchT = 1; if (!Game.tut && Game.tutWanted() && !Game.seeds.some(b => b.state === 'bud' && dist(b.x, b.y, o.x, o.y) <= Game.radiusFor(b.type))) Game.startTut(o); }
    }
    if (p.t < 1 && p.out) pending = true;
    if (p.t >= 1) Game.pulses.splice(i, 1);
  }
  // chain settles when nothing is pending
  if (Game.chainActive && !pending) {
    Game.settleT += dt;
    if (Game.settleT > .3) { Game.chainActive = false; Game.chainEnd(); }
  }
  // particles
  const wind = Math.sin(t * .8) * 18;
  for (let i = Game.petals.length - 1; i >= 0; i--) {
    const p = Game.petals[i]; p.t += gdt; if (p.t > p.life) { Game.petals.splice(i, 1); continue; }
    p.vy += 55 * gdt; p.vx += (wind - p.vx) * .4 * gdt; p.vy = Math.min(p.vy, 40);
    p.x += (p.vx + Math.sin(t * 3 + p.sw) * 14) * gdt; p.y += p.vy * gdt; p.rot += p.vr * gdt;
  }
  for (let i = Game.sparkles.length - 1; i >= 0; i--) { const p = Game.sparkles[i]; p.t += gdt; if (p.t > p.life) { Game.sparkles.splice(i, 1); continue; } p.x += p.vx * gdt; p.y += p.vy * gdt; p.vy += 20 * gdt; }
  for (let i = Game.floats.length - 1; i >= 0; i--) { const f = Game.floats[i]; f.t += dt; if (f.t > 1.1) Game.floats.splice(i, 1); }
  for (let i = Scene.ripples.length - 1; i >= 0; i--) { const r = Scene.ripples[i]; r.t += dt * .8; if (r.t >= 1) Scene.ripples.splice(i, 1); }
  Game.updateCreatures(dt, t);
  if (Game.state === 'ending') { Game.endT -= dt; if (Game.endT <= 0) Game.finish(); }
};
Game.chainEnd = function () {
  UI.chainHide();
  const sleeping = Game.seeds.filter(s => s.state === 'sleep');
  if (sleeping.length === 0) {
    Game.fullBloom = true; Game.sparksSaved = Game.sparks;
    const bonus = 40 + Game.sparks * 30; Game.score += bonus; UI.score();
    UI.toast('🌼 Full bloom! +40' + (Game.sparks ? ` · ${Game.sparks} spark${Game.sparks > 1 ? 's' : ''} saved +${Game.sparks * 30}` : ''), 2.4);
    Audio.full(Game.chain); Game.nibPeek(3, 'happy'); Game.nib.hopV = -180; Game.pip.earWave = true; Game.pip.waveT = 2;
    Game.state = 'ending'; Game.endT = 2.1; return;
  }
  if (Game.sparks <= 0) { Game.state = 'ending'; Game.endT = 1.1; return; }
  // round 1 teaches the decision: the two strongest seeds glow brighter
  if (Game.round === 1 && !Game.daily) {
    const scored = sleeping.map(s => [Game.reach(s, Game.seeds), s]).sort((a, b) => b[0] - a[0]);
    const a = scored[0][1]; a.hint = true;
    const reachA = new Set(); (function flood(x) { reachA.add(x); const R = Game.radiusFor(x.type); for (const o of Game.seeds) if (!reachA.has(o) && o.state === 'sleep' && dist(x.x, x.y, o.x, o.y) <= R) flood(o); })(a);
    const b = scored.find(([, s]) => !reachA.has(s)); if (b) b[1].hint = true;   // the second hint opens a different cluster: a real choice
    Game.anyHint = true;
  }
};
Game.finish = function () { Game.state = 'results'; UI.results(); };

Game.updateCreatures = function (dt, t) {
  const m = Game.mochi;
  m.blinkT -= dt; if (m.blinkT <= 0) { m.blinkT = 2 + Math.random() * 3; m.blinkAnim = .25; }
  if (m.blinkAnim > 0) { m.blinkAnim -= dt; m.blink = Math.abs(Math.sin(m.blinkAnim / .25 * Math.PI)); } else m.blink = 1;
  if (m.wowT > 0) { m.wowT -= dt; if (m.wowT <= 0) m.mood = 'awake'; }
  if (m.happyT > 0) { m.happyT -= dt; if (m.happyT <= 0) m.mood = 'awake'; }
  m.hopV += 1300 * dt; m.hop += m.hopV * dt; if (m.hop > 0) { m.hop = 0; if (m.hopV > 60) { m.hopV = -m.hopV * .35; m.squash = .6; } else m.hopV = 0; }
  m.squash += (0 - m.squash) * (1 - Math.pow(.002, dt)); if (m.hop < -4) m.squash = lerp(m.squash, -.35, .2);
  if (Game.lastBloom) { m.lookX = clamp((Game.lastBloom.x - m.x) / W * 3, -1, 1); m.lookY = clamp((Game.lastBloom.y - m.y) / H * 3, -1, 1); }

  p.blinkT -= dt; if (p.blinkT <= 0) { p.blinkT = 2.5 + Math.random() * 3; p.blinkAnim = .22; }
  if (p.blinkAnim > 0) { p.blinkAnim -= dt; p.blink = Math.abs(Math.sin(p.blinkAnim / .22 * Math.PI)); } else p.blink = 1;
  if (p.waveT > 0) { p.waveT -= dt; if (p.waveT <= 0) p.earWave = false; }
  p.mood = p.waveT > 1.3 ? 'happy' : 'awake';
  const nb = Game.nib;
  if (nb.peekT > 0) { nb.peekT -= dt; if (nb.peekT <= 0) nb.target = 0; }
  nb.out += (nb.target - nb.out) * (1 - Math.pow(nb.target > nb.out ? .002 : .05, dt));
  nb.hopV += 1300 * dt; nb.hop += nb.hopV * dt; if (nb.hop > 0) { nb.hop = 0; nb.hopV = 0; }
  nb.blinkT -= dt; if (nb.blinkT <= 0) { nb.blinkT = 2.5 + Math.random() * 3; nb.blinkAnim = .2; }
  if (nb.blinkAnim > 0) { nb.blinkAnim -= dt; nb.blink = Math.abs(Math.sin(nb.blinkAnim / .2 * Math.PI)); } else nb.blink = 1;

    mo.tx = ax + Math.sin(t * .9) * Game.U * .22; mo.ty = ay + Math.cos(t * 1.3) * Game.U * .12 - Game.U * .08;
    const dx = mo.tx - mo.x, dy = mo.ty - mo.y; mo.x += dx * (1 - Math.pow(.3, dt)); mo.y += dy * (1 - Math.pow(.3, dt));

  }
};

// ----------------------------------------------------------------- Render
const FONT = getComputedStyle(document.body).fontFamily;
function render(t) {
  ctx.save();

    const s = order[i];

  ctx.restore();
}

// ----------------------------------------------------------------- Input & boot
let lastT = 0, running = false, rafId = 0, gameT = 0;
function frame(ts) {
  rafId = requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000; lastT = ts; dt = Math.min(dt, .05); // clamp after tab switches
  gameT += dt;
  Game.update(dt, gameT); UI.tick(dt);
  render(gameT);
}
function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }

canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.focus({ preventScroll: true }); Game.tapAt(e.clientX, e.clientY); }, { passive: false });
['touchstart', 'touchmove', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => { if (e.target === canvas || e.target.closest('.hud, .sparks')) e.preventDefault(); }, { passive: false }));
canvas.addEventListener('contextmenu', e => e.preventDefault());

// keyboard: arrows cycle sleeping seeds, Enter/Space blooms, R new garden, M mute
canvas.addEventListener('keydown', e => {
  if (Album.isOpen()) return;
  const sleeping = Game.seeds.map((s, i) => [s, i]).filter(([s]) => s.state === 'sleep').map(([, i]) => i);
  if (['ArrowRight', 'ArrowDown', 'Tab'].includes(e.key) && !e.shiftKey && sleeping.length) { e.preventDefault(); const k = sleeping.indexOf(Game.focus); Game.focus = sleeping[(k + 1) % sleeping.length]; }
  else if (['ArrowLeft', 'ArrowUp'].includes(e.key) || (e.key === 'Tab' && e.shiftKey)) { if (!sleeping.length) return; e.preventDefault(); const k = sleeping.indexOf(Game.focus); Game.focus = sleeping[(k - 1 + sleeping.length) % sleeping.length]; }
  else if ((e.key === 'Enter' || e.key === ' ') && Game.chainActive) {
    e.preventDefault();
    const live = Game.seeds.filter(s => s.state === 'sleep' && s.catchT > 0);
    if (live.length) Game.tapSeed(live.includes(Game.seeds[Game.focus]) ? Game.seeds[Game.focus] : live.sort((a, b) => a.catchT - b.catchT)[0]);
  }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Audio.unlock(); if (Game.focus < 0 || !Game.seeds[Game.focus] || Game.seeds[Game.focus].state !== 'sleep') Game.focus = sleeping.length ? (Game.seeds.findIndex(s => s.hint && s.state === 'sleep') >= 0 ? Game.seeds.findIndex(s => s.hint && s.state === 'sleep') : sleeping[0]) : -1; if (Game.focus >= 0) { Game.tapSeed(Game.seeds[Game.focus]); Game.focus = -1; } }
  else if (e.key.toLowerCase() === 'r') { Game.newRound(); }
  else if (e.key.toLowerCase() === 'm') { UI.setMuted(!Audio.muted); }
});

window.addEventListener('orientationchange', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 200); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
window.addEventListener('pagehide', stop); window.addEventListener('pageshow', start);

UI.setMuted(!!Store.get().muted);
resize();
Game.newRound();
start();
window.MossMoon = { Game, Scene, Store, Audio, UI }; // for testing / tinkering
